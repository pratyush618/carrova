schema: 1
id: bash
name: Bash
category: shells
description: Bash startup files, aliases and readline config. History is a separate, sensitive item (it can contain secrets typed on the command line).
detect:
  linux:
    - binary: bash
    - path: { root: home, rel: .bashrc }
  macos:
    - binary: bash
    - path: { root: home, rel: .bashrc }
items:
  - id: config
    label: Bash startup files, aliases and readline config
    paths:
      - { root: home, rel: .bashrc }
      - { root: home, rel: .bash_profile }
      - { root: home, rel: .bash_login }
      - { root: home, rel: .bash_logout }
      - { root: home, rel: .bash_aliases }
      - { root: home, rel: .profile }
      - { root: home, rel: .inputrc }
    flags:
      portability: same_os
      sensitive: false
      requires_closed: false
      default: true
  - id: history
    label: Bash command history
    paths:
      - { root: home, rel: .bash_history }
    flags:
      portability: same_os
      sensitive: true
      requires_closed: false
      default: false
