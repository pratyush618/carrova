schema: 3
id: git
name: Git
category: dev-tools
description: Global Git configuration (user identity, aliases, global ignore and attributes). Stored credentials are a separate, sensitive item.
detect:
  linux:
    - binary: git
    - path: { root: home, rel: .gitconfig }
    - path: { root: user_config, rel: git }
  macos:
    - binary: git
    - path: { root: home, rel: .gitconfig }
    - path: { root: home, rel: .config/git }
  windows:
    - binary: git
    - path: { root: home, rel: .gitconfig }
    - path: { root: home, rel: .config/git }
items:
  - id: config
    label: Global Git config, ignore and attributes
    paths:
      - { root: home, rel: .gitconfig }
      - { root: user_config, rel: git }
    # Git reads $XDG_CONFIG_HOME/git, else ~/.config/git, on every OS.
    os:
      macos:
        paths:
          - { root: home, rel: .gitconfig }
          - { root: home, rel: .config/git }
      windows:
        paths:
          - { root: home, rel: .gitconfig }
          - { root: home, rel: .config/git }
    exclude: ["**/credentials"]
    flags:
      portability: cross_os
      sensitive: false
      requires_closed: false
      default: true
  - id: credentials
    label: Stored Git credentials (plain-text tokens/passwords)
    paths:
      - { root: home, rel: .git-credentials }
      - { root: user_config, rel: git/credentials }
    os:
      macos:
        paths:
          - { root: home, rel: .git-credentials }
          - { root: home, rel: .config/git/credentials }
      windows:
        paths:
          - { root: home, rel: .git-credentials }
          - { root: home, rel: .config/git/credentials }
    flags:
      portability: cross_os
      sensitive: true
      requires_closed: false
      default: false
