schema: 3
id: gh
name: GitHub CLI
category: dev-tools
description: GitHub CLI settings and aliases (config.yml). Your login (hosts.yml) can hold OAuth tokens and is a separate, sensitive item. Tokens kept in the system keyring cannot be moved; run gh auth login on the new machine.
detect:
  linux:
    - binary: gh
    - path: { root: user_config, rel: gh }
  macos:
    - binary: gh
    - path: { root: home, rel: .config/gh }
  windows:
    - binary: gh
    - path: { root: user_config, rel: GitHub CLI }
# gh uses ~/.config/gh and ~/.local/share/gh on macOS too; on Windows
# %AppData%\GitHub CLI (config) and %LocalAppData%\GitHub CLI (data).
items:
  - id: config
    label: GitHub CLI settings and aliases (config.yml)
    paths:
      - { root: user_config, rel: gh/config.yml }
    os:
      macos:
        paths:
          - { root: home, rel: .config/gh/config.yml }
      windows:
        paths:
          - { root: user_config, rel: GitHub CLI/config.yml }
    flags:
      portability: cross_os
      sensitive: false
      requires_closed: false
      default: true
  - id: hosts
    label: GitHub CLI login (hosts.yml; may contain OAuth tokens)
    paths:
      - { root: user_config, rel: gh/hosts.yml }
    os:
      macos:
        paths:
          - { root: home, rel: .config/gh/hosts.yml }
      windows:
        paths:
          - { root: user_config, rel: GitHub CLI/hosts.yml }
    flags:
      portability: cross_os
      sensitive: true
      requires_closed: false
      default: false
  - id: extensions
    label: Installed gh extensions (reinstallable)
    paths:
      - { root: user_data, rel: gh/extensions }
    os:
      macos:
        paths:
          - { root: home, rel: .local/share/gh/extensions }
      windows:
        paths:
          - { root: user_data, rel: GitHub CLI/extensions }
    flags:
      portability: same_os
      sensitive: false
      requires_closed: false
      default: false
  - id: keyring-token
    label: Login tokens stored in the system keyring
    unmovable: gh stores tokens in the OS keyring by default; they are bound to this machine. Run gh auth login on the new machine.
