binaries: [gh]
detected: true
items:
  config:
    files:
      - user_config:GitHub CLI/config.yml
  hosts:
    files:
      - user_config:GitHub CLI/hosts.yml
  extensions:
    files:
      - user_data:GitHub CLI/extensions/gh-dash/gh-dash
  keyring-token:
    files: []
not_captured:
  - AppData/Roaming/GitHub CLI/state.yml
