[package]
name = "carrova-desktop"
description = "Carrova desktop front-end (Tauri shell over the engine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Placeholder: becomes the .deb `Maintainer:` field. Replace before release.
authors = ["Pratyush Sharma <mail@byteveda.org>"]

[lib]
name = "carrova_desktop"

[[bin]]
name = "carrova-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
futures-channel = { workspace = true }
carrova-bundle = { workspace = true }
carrova-core = { workspace = true }
carrova-platform = { workspace = true }
carrova-recipe = { workspace = true }
carrova-report = { workspace = true }
carrova-view = { workspace = true }
serde = { workspace = true }
# `generate_context!` embeds plugin config (`plugins.updater`) as `serde_json` values.
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
carrova-crypto = { workspace = true }
carrova-platform = { workspace = true, features = ["fake"] }
tempfile = { workspace = true }

[lints]
workspace = true
