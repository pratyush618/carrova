[package]
name = "carrova-desktop"
description = "Carrova desktop front-end (Tauri shell over the engine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Placeholder: becomes the .deb `Maintainer:` field. Replace before release.
authors = ["Pratyush Sharma <mail@byteveda.org>"]

[lib]
name = "carrova_desktop"
# Android loads the cdylib; `staticlib` is for iOS.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "carrova-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
futures-channel = { workspace = true }
carrova-bundle = { workspace = true }
carrova-core = { workspace = true }
carrova-crypto = { workspace = true }
carrova-link = { workspace = true }
carrova-platform = { workspace = true }
carrova-recipe = { workspace = true }
carrova-report = { workspace = true }
carrova-view = { workspace = true }
data-encoding = { workspace = true }
percent-encoding = "2"
serde = { workspace = true }
# `generate_context!` embeds plugin config (`plugins.updater`) as `serde_json` values.
serde_json = { workspace = true }
# Not `workspace = true`: tauri-cli only sees `tray-icon` here, and without
# it the AppImage ships no appindicator and crashes closing to the tray.
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

# Desktop only: phones update through a new APK, not the updater.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { workspace = true }

[dev-dependencies]
carrova-platform = { workspace = true, features = ["fake"] }
tempfile = { workspace = true }

[lints.rust]
# `deny`, not workspace `forbid`: the mobile entry macro emits `extern` JNI
# glue (ADR 0003); lib.rs allows it on that one fn. Keep in sync with the workspace.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
# pedantic-lite
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
