<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0E11" />
    <script>
      // Before first paint, so a saved theme never flashes the other one (see src/theme.ts).
      try {
        var p = localStorage.getItem('carrova-theme');
      } catch (e) {}
      document.documentElement.dataset.theme =
        p === 'light' || p === 'dark'
          ? p
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
    </script>
    <title>Carrova: your setup, on your new computer</title>
    <meta
      name="description"
      content="Carrova moves your app settings, keys and data to a new computer over your own network. You pick what moves. Nothing changes until you approve. Free and open source."
    />
    <meta property="og:title" content="Carrova: your setup, on your new computer" />
    <meta
      property="og:description"
      content="Move app settings, keys and data over your own network. No account, no cloud. Free and open source."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://carrova.byteveda.org/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
