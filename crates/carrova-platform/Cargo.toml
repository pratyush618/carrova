[package]
name = "carrova-platform"
description = "Carrova platform layer: the only OS-aware crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# LAN interfaces and UDP sockets: every adapter needs them.
if-addrs = { workspace = true }
serde = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
thiserror = { workspace = true }
ts-rs = { workspace = true, optional = true }

# Safe syscalls for the Linux and macOS adapters (fsops, netops).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Session bus: tray-host detection (`org.kde.StatusNotifierWatcher`), screen
# wake and lock query (`org.freedesktop.ScreenSaver`).
zbus = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { workspace = true }

[target.'cfg(windows)'.dependencies]
known-folders = { workspace = true }
# `disk`: free space per volume.
sysinfo = { workspace = true, features = ["disk"] }
winapi-util = { workspace = true }
# Explorer entries: per-user shell verbs.
winreg = { workspace = true }

[features]
# In-memory/tempdir-backed Platform for tests (recipe fixtures, scan tests).
fake = []
# TypeScript bindings (ts-rs) for the types front-ends receive.
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
