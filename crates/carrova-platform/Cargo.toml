[package]
name = "carrova-platform"
description = "Carrova platform layer: the only OS-aware crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
if-addrs = { workspace = true }
rustix = { workspace = true }
socket2 = { workspace = true }

[features]
# In-memory/tempdir-backed Platform for tests (recipe fixtures, scan tests).
fake = []
# TypeScript bindings (ts-rs) for the types front-ends receive.
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
