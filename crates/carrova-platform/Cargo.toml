[package]
name = "carrova-platform"
description = "Carrova platform layer: the only OS-aware crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# LAN interfaces and UDP sockets: every adapter needs them.
if-addrs = { workspace = true }
serde = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
thiserror = { workspace = true }
ts-rs = { workspace = true, optional = true }

# Safe syscalls for the Linux and macOS adapters (fsops, netops); `event`:
# poll, for the Linux directory watch.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event", "net"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Session bus: tray-host detection (`org.kde.StatusNotifierWatcher`), screen
# wake and lock query (`org.freedesktop.ScreenSaver`).
zbus = { workspace = true }
# Clipboard: X11 text, Wayland data-control, content hash for the change poll.
arboard = { workspace = true }
blake3 = { workspace = true }
x11rb = { workspace = true }
wl-clipboard-rs = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# Clipboard, Downloads, ring, multicast lock through Kotlin glue (ADR 0003).
jni = { workspace = true }
ndk-context = { workspace = true }

# Directory watch (FSEvents, ReadDirectoryChangesW).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
notify = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { workspace = true }

[target.'cfg(windows)'.dependencies]
known-folders = { workspace = true }
# `disk`: free space per volume.
sysinfo = { workspace = true, features = ["disk"] }
winapi-util = { workspace = true }
# Explorer entries: per-user shell verbs.
winreg = { workspace = true }

[features]
# In-memory/tempdir-backed Platform for tests (recipe fixtures, scan tests).
fake = []
# TypeScript bindings (ts-rs) for the types front-ends receive.
ts = ["dep:ts-rs"]

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

# ADR 0003: `deny` (not the workspace `forbid`) so `src/android/jni.rs` alone
# can allow `unsafe`; `[lints]` cannot be combined with `workspace = true`, so
# the other workspace lints are repeated.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
# pedantic-lite
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
