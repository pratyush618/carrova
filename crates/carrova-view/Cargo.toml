[package]
name = "carrova-view"
description = "Pure presentation models of Carrova engine results, shared by every front-end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
carrova-bundle = { workspace = true }
carrova-core = { workspace = true }
carrova-crypto = { workspace = true }
carrova-platform = { workspace = true }
# Only for the TS export of error-report types (desktop IPC contract).
carrova-report = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
carrova-platform = { workspace = true, features = ["fake"] }
tempfile = { workspace = true }

[features]
# TypeScript bindings (ts-rs) of the view-models and every engine type a
# front-end receives or sends; `tests/export_bindings/main.rs` writes them.
ts = ["dep:ts-rs", "carrova-core/ts", "carrova-platform/ts", "dep:carrova-report", "carrova-report/ts"]

[lints]
workspace = true
