# Two release trains from one repo, separated by tag:
#   v*          desktop app: AppImage + .deb + .rpm, x86_64 + aarch64 (.dmg/.msi/NSIS off until Phase 5),
#               one updater latest.json for all three OSes
#   recipes-v*  recipe bundle: immutable `recipes-vN` release + the
#               `recipes-latest` pointer (latest.json = {"version": N})
#
# Job graph (both trains):
#   verify ─► sign-bundle ─┬─► app      (v*)
#                          └─► recipes  (recipes-v*)
#
# REPO SETTINGS REQUIRED (not expressible in YAML): the `release` environment
# must have deployment tag rules `v*` + `recipes-v*` (no required reviewers:
# releases run unattended; the app lands as a draft for a manual smoke test),
# and BUNDLE_SIGNER_* / TAURI_SIGNING_* (+ optional APPLE_* / WINDOWS_*
# OS-signing secrets, see packaging/README.md) must be environment secrets
# (not repo secrets). Add tag protection (rulesets) for both patterns as well.
#
# Secret isolation: only `sign-bundle` sees BUNDLE_SIGNER_*; it installs Rust
# and nothing else (no Node/pnpm, no Tauri libs, no caches). The app job sees
# only the updater + OS-signing keys; the recipes job sees no environment
# secrets at all.
name: release

on:
  push:
    tags: ["v*", "recipes-v*"]

permissions:
  contents: read

# Never cancel a release halfway; queue per tag instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: tag on main + no placeholders + plugins rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history + origin/* branches for the ancestry check
      # A tag pushed on a side branch must not release unreviewed code.
      - name: Tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main"
            exit 1
          }
      - name: Release preflight
        run: bash .github/scripts/release-preflight.sh
      # The signed bundle ships plugins/*/plugin.wasm as committed; prove each
      # one is what its reviewed source builds to.
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          cache: "false"
      - run: just plugins-check

  # Build + sign + verify the recipe bundle; the only job holding the signer.
  sign-bundle:
    name: sign recipe bundle
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: "true" # xtask signs; nothing else is installed
          cache: "false"
      # recipes-vN → N. The app embeds version 1: shipped bundles never enter
      # the update store, so their version only labels `recipes status`.
      - name: Bundle version from tag
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            recipes-v*) version="${GITHUB_REF_NAME#recipes-v}" ;;
            *) version=1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/bundle
        with:
          version: ${{ steps.version.outputs.version }}
          signer-key: ${{ secrets.BUNDLE_SIGNER_KEY }}
          signer-cert: ${{ secrets.BUNDLE_SIGNER_CERT }}
      # Pointer for `recipes-latest`; kept outside dist/recipes so it is
      # neither embedded in the app nor part of the immutable bundle.
      - name: Pointer file
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/pointer
          jq -n --argjson version "$VERSION" '{version: $version}' > dist/pointer/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-bundle
          path: |
            dist/recipes
            dist/pointer
          if-no-files-found: error
          retention-days: 7

  app:
    name: desktop app (${{ matrix.os }})
    needs: sign-bundle
    if: startsWith(github.ref_name, 'v')
    strategy:
      fail-fast: false # a broken signer on one OS must not cancel the others
      matrix:
        include:
          # Bundle targets per OS come from tauri.{macos,windows}.conf.json.
          # Oldest supported Ubuntu: binaries need the build host's glibc or newer.
          - { os: ubuntu-22.04, args: "" } # x86_64 AppImage + .deb + .rpm
          - { os: ubuntu-22.04-arm, args: "" } # aarch64 AppImage + .deb + .rpm
          # v0.1 is Ubuntu only; re-enable once the Phase 5 exit gate passes.
          # - { os: macos-latest, args: "--target universal-apple-darwin" } # .app + .dmg
          # - { os: windows-latest, args: "" } # .msi + NSIS .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          tauri-deps: "true" # apt libs on Linux only
          node: "true"
          cache: "false"
      - name: Rust targets for the universal macOS app
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # The app ships the signed bundle so it works offline on first run;
      # tauri.release.conf.json maps dist/recipes into the app's resources.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recipe-bundle
          path: dist
      # Pin the shipped index hash into the binary (carrova-bundle reads it via
      # option_env!), so the app only trusts exactly this bundle.
      - name: Pin shipped recipe bundle
        shell: bash
        run: echo "CARROVA_SHIPPED_INDEX_HASH=$(cargo xtask bundle pin --dir dist/recipes)" >> "$GITHUB_ENV"

      # OS signing is optional: each block runs only when its secrets exist, so
      # forks and pre-certificate releases still build (unsigned) packages.
      # Missing secrets expand to empty strings, which are not "unset" to the
      # Tauri bundler, hence export-if-present instead of `env:` on tauri-action.
      - name: macOS signing + notarization secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          [[ -n "$APPLE_CERTIFICATE" ]] || { echo "::warning::no APPLE_CERTIFICATE: macOS build is unsigned and not notarized"; exit 0; }
          # Heredoc form: a base64 secret pasted with line breaks stays one value.
          export_set() {
            for name in "$@"; do
              [[ -z "${!name:-}" ]] || printf '%s<<__END__\n%s\n__END__\n' "$name" "${!name}" >> "$GITHUB_ENV"
            done
          }
          export_set APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          # Notarization: App Store Connect API key if present, else Apple ID.
          if [[ -n "$APPLE_API_KEY" ]]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
            export_set APPLE_API_ISSUER APPLE_API_KEY
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          else
            export_set APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
      - name: Windows code-signing certificate
        id: winsign
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::warning::no WINDOWS_CERTIFICATE: Windows installers are unsigned"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP certificate.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          # Extra config layer: tauri signs with the imported cert by thumbprint.
          $conf = Join-Path $env:GITHUB_WORKSPACE apps/desktop/src-tauri/tauri.signing.conf.json
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } } } | ConvertTo-Json -Depth 4 | Set-Content $conf
          "args=--config src-tauri/tauri.signing.conf.json" >> $env:GITHUB_OUTPUT

      # tauri-action runs `<tauriScript> build` (same build as `just package`)
      # and merges every OS's updater entry into one latest.json on the release.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater (minisign) key, separate from the recipe bundle keys.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: just tauri
          args: --config src-tauri/tauri.release.conf.json ${{ steps.winsign.outputs.args }} ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Carrova ${{ github.ref_name }}
          # Draft: a maintainer smoke-tests every OS's packages, then publishes.
          # Clients only see it (releases/latest/download/latest.json) once published.
          releaseDraft: true
          uploadUpdaterJson: true

  recipes:
    name: publish recipe bundle
    needs: sign-bundle
    if: startsWith(github.ref_name, 'recipes-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create releases and update the recipes-latest pointer
    # One recipe publication at a time across all tags, so the monotonicity
    # check and the pointer update can't interleave. GitHub keeps at most one
    # pending run per group (a newer pending run replaces an older one); the
    # check below still refuses any version that is not newer.
    concurrency:
      group: recipes-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.sign-bundle.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recipe-bundle
          path: dist

      - name: Version is newer than the published one
        id: published
        run: |
          releases=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          current=0 exists=false
          if grep -qx recipes-latest <<< "$releases"; then
            exists=true
            gh release download recipes-latest --pattern latest.json --dir "$RUNNER_TEMP/published"
            current=$(jq -er '.version' "$RUNNER_TEMP/published/latest.json")
            [[ "$current" =~ ^[0-9]+$ ]] || { echo "::error::bad published pointer: $current"; exit 1; }
          fi
          if (( VERSION <= current )); then
            echo "::error::recipes v$VERSION is not newer than published v$current"
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      # Assets are flat files (index.json, index.sig.json, <hash>.<ext>).
      # --latest=false everywhere: "Latest release" must stay the app release,
      # because the app updater reads releases/latest/download/latest.json.
      - name: Publish recipes-vN release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/recipes/* \
            --verify-tag --latest=false --title "Recipes $VERSION"

      # Clients read releases/download/recipes-latest/latest.json, then fetch
      # the immutable recipes-vN assets. The pointer is replaced in place (no
      # release delete); a missing pointer reads as "no update yet".
      - name: Point recipes-latest at vN
        env:
          EXISTS: ${{ steps.published.outputs.exists }}
        run: |
          if [[ "$EXISTS" == true ]]; then
            gh release upload recipes-latest dist/pointer/latest.json --clobber
          else
            gh release create recipes-latest dist/pointer/latest.json \
              --target "$GITHUB_SHA" --latest=false \
              --title "Recipes (latest)" --notes "Pointer to the newest recipes-vN release."
          fi
