# Rust engine, CLI and desktop shell: lint, build, test, then container e2e.
name: engine

on:
  push:
    branches: [main]
    paths: &engine-paths
      - crates/**
      - apps/cli/**
      - apps/desktop/src-tauri/** # workspace member: linted and built here too
      - xtask/**
      - tests/e2e/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - clippy.toml
      - rustfmt.toml
      - justfile
      - scripts/** # `just ci` runs scripts/check-test-layout.sh
      - .github/actions/setup/**
      - .github/workflows/engine.yml
  pull_request:
    paths: *engine-paths

permissions:
  contents: read

# One run per branch/PR; a new push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.just }} (${{ matrix.os }})
    strategy:
      fail-fast: false # one OS failing must not hide the others' results
      matrix:
        include:
          # Linux runs everything `just ci` covers (bindings, test layout, UI too).
          - { os: ubuntu-latest, node: "true", just: ci }
          # Portable subset; Linux-only recipes (e2e, setup-ubuntu, load-watch) stay out.
          - { os: macos-latest, node: "false", just: ci-portable } # arm64
          - { os: windows-latest, node: "false", just: ci-portable }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          tauri-deps: "true" # `--workspace` includes carrova-desktop (apt libs on Linux only)
          node: ${{ matrix.node }}
      - run: just "$RECIPE" # the justfile runs under Git Bash on Windows
        shell: bash
        env:
          RECIPE: ${{ matrix.just }}

  e2e:
    name: container e2e (archive + LAN)
    runs-on: ubuntu-latest # ships with docker
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          cache-key: e2e # only carrova-cli is built here; no WebKit libs needed
      - run: just e2e
      - run: just e2e --lan
