add({ id: "screen", group: "Screen sharing", title: "Share this screen", layout: "doc", states: [["prompt", "Someone asks"], ["choose", "You start it"], ["portal", "Desktop's own prompt"], ["denied", "Desktop prompt cancelled"], ["sharing", "Being viewed"], ["control", "Being controlled"], ["protected", "Protected windows"], ["locked", "Paused while locked"], ["ended", "Ended"]],
  note: "Every share is asked on this computer, then confirmed by the desktop itself on Wayland (the portal dialog is the system's, not ours). While anyone watches, a bar stays on top that can't be hidden; control is a second, separate yes. Locking pauses the share; windows that protect their content show black; the end says who watched and for how long.",

    if (st === "ended") return desk(osnote("Carrova · now", "Desktop PC stopped viewing this screen", "Watched for 12 min. It had control for 2 min. Nothing is recorded or kept.", ""), { pip: false });
    if (st === "protected") return desk(`<div class="sharebar"><span class="rec"></span><b>Desktop PC is viewing this screen</b><span class="muted">03:10</span>${btn("Allow control", { size: "sm", go: "screen:control" })}${btn("Stop", { size: "sm", kind: "danger-fill" })}</div>
      <div class="winmini" style="inset-block-start:110px;inline-size:520px;block-size:340px"><div class="tb">${icon("lock")}Bitwarden</div><div class="bd" style="background:#000;color:#9a9ca3">Shown as black to Desktop PC</div></div>
      <div class="callout" style="right:40px;top:150px">Apps that protect their content (password managers, some video) show black to the viewer. You see them as usual.</div>`);

      <div class="callout" style="left:24px;bottom:24px">This dialog belongs to your desktop (GNOME on Wayland), not Carrova. With “Remember” it isn't asked again until you log out.</div>`);

const remoteDesk = cursor => `<div class="remote"><div class="remote__bar">Desktop PC</div><div class="remote__win"></div><div class="remote__win b"></div>${cursor ? `<span class="cursor" style="left:58%;top:52%"></span>` : ""}</div>`;
add({ id: "viewer", group: "Screen sharing", title: "View another screen", layout: "doc", states: [["waiting", "Waiting for them"], ["declined", "They declined"], ["view", "Watching"], ["slow", "Slow network"], ["full", "Full screen"], ["asking", "Asking for control"], ["control", "Controlling"], ["revoked", "Control taken back"], ["phone", "Phone mirror"], ["lost", "Connection lost"]],
  note: "Watching a computer or the phone. View/Control is one switch; turning on Control asks the other side first, and they can take it back any time. On a slow network the picture drops quality before it drops frames, and says so. Full screen keeps one way out on screen. Phone mirroring uses Android's screen-capture prompt on the phone; controlling the phone needs Android's accessibility permission, so it's off unless set up.",
  render(st) {
    if (st === "full") return desk(`<div class="viewer" style="inset:30px 0 0;border-radius:0;border:0;grid-template-rows:1fr"><div style="position:relative;display:grid">${remoteDesk(true).replace('class="remote"', 'class="remote" style="margin:0;border-radius:0"')}<span class="vchip">${chip("", "Desktop PC · full screen · Ctrl + Alt + F to leave")}</span></div></div>`);
    if (st === "phone") return desk(`<div class="viewer viewer--phone"><div class="viewer__bar"><b>Pixel 8</b><span class="muted">View only</span><span class="spacer" style="flex:1"></span>${btn("End", { size: "sm" })}</div><div style="padding:6px"><div class="remote remote--phone" style="block-size:470px"><div class="remote__bar">21:06</div><div class="remote__app">${"<i></i>".repeat(12)}</div></div></div></div>`);
    const bar = `<div class="viewer__bar"><b>Desktop PC</b><span class="muted">Windows 11 · ${st === "slow" ? "240 ms" : "18 ms"}</span>${st === "slow" ? chip("warn", "Lower quality · slow network", "noNet") : ""}<span class="spacer" style="flex:1"></span>${seg(["View", "Control"], st === "control" ? "Control" : "View")}${btn("", { kind: "quiet", size: "sm", icon: "expand", label: "Full screen", cls: "btn--icon" })}${btn("End", { size: "sm" })}</div>`;
    const extra = st === "asking" ? `<span class="vchip">${chip("accent", "Asking Desktop PC to allow control…")}</span>`
      : st === "revoked" ? `<span class="vchip">${chip("warn", "Desktop PC took back control. You can still watch.")}</span>`
      : st === "waiting" ? `<div class="veil"><div><b>Waiting for Desktop PC</b><p>Someone there needs to allow it. Nothing is shown until they do.</p>${btn("Cancel")}</div></div>`
      : st === "declined" ? `<div class="veil"><div><b>Desktop PC declined</b><p>Nothing was shared. Whoever is there said no.</p>${btn("Close")}</div></div>`
      : st === "lost" ? `<div class="veil"><div><b>Connection lost</b><p>Desktop PC left the network or went to sleep. Trying again…</p>${btn("End")}</div></div>` : "";
    return desk(`<div class="viewer">${bar}<div style="position:relative;display:grid">${["waiting", "declined"].includes(st) ? `<div class="remote" style="background:#111214"></div>` : remoteDesk(st === "control")}${extra}</div></div>`);
  } });

  return `<div class="w4in">${banner}<div class="ig"><h3>Arrange screens</h3><div class="arr">
      <div class="scr is-me" style="left:20%;top:26%;width:34%;height:44%">${icon("laptop")}<b>${ME}</b><small>This computer</small><span class="edge" style="inset-block:12px;inset-inline-end:-3px;inline-size:4px"></span></div>
      <div class="scr${drag ? " is-drag" : ""}" style="${pcPos};width:30%;height:${drag ? 30 : 48}%">${icon("monitor")}<b>Desktop PC</b><small>${drag ? "Drop below" : "1920 × 1080"}</small></div>
    </div><p class="foot">Drag screens to match your desk. Move the pointer off the lit edge to use the other computer.</p></div>
    ${ig("", [srow("Share keyboard and mouse", "With Desktop PC, while both are on this network.", toggle(true)), srow("Come back with", "Or move the pointer back across the edge.", `<span class="kbd4">Scroll Lock</span>`), srow("Keep the pointer on this screen", "Press again to let it cross.", `<span class="kbd4">Shift + Scroll Lock</span>`), srow("Clipboard follows the pointer", "Only while the shared clipboard is on.", toggle(true)), srow("Only when the other computer is unlocked", "", toggle(true))])}</div>`;
}
add({ id: "kvm", group: "Keyboard and mouse", title: "Keyboard and mouse", layout: "doc", states: [["intro", "Not set up"], ["arrange", "Arrange"], ["dragging", "Dragging a screen"], ["portal", "Desktop permission missing"], ["request", "Someone asks"], ["crossing", "Pointer crossed over"], ["clipboard", "Clipboard came along"], ["pinned", "Pointer kept here"], ["secure", "Password box blocks crossing"], ["gone", "Other computer went away"], ["touchpad", "Phone as touchpad"]],
  note: "One keyboard and mouse across computers. The arrangement decides which edge leads where. Every computer being controlled asks first, then needs its desktop's input permission on Wayland. A hotkey keeps the pointer here; a password box or lock screen keeps it here too, so typed secrets never cross. If the other computer goes away, the pointer comes home. The phone can act as touchpad and keyboard for this computer.",
  render(st) {
    if (st === "intro") return w4({ settings: "screen", title: "Screen and input", body: `<div class="center4"><div>${lg(icon("kb"), "accent")}<b>One keyboard and mouse for two computers</b><p>Move the pointer off the edge of this screen and carry on on Desktop PC. Each computer asks before another one can use it.</p><div class="row">${btn("Not now", { kind: "quiet" })}${btn("Set up", { kind: "primary", go: "kvm:arrange" })}</div></div></div>` });
    if (st === "clipboard") return desk(`<div class="edgeglow"></div><div class="osd">${icon("kb")}<span><b>Using Desktop PC</b> <small>· move back left or press</small></span><span class="k">Scroll Lock</span></div><div class="ostoast" style="inset-block-end:100px">${icon("clip")}What you copied came along</div>`);
    if (st === "pinned") return desk(`<div class="osd">${icon("lock")}<span><b>Pointer stays on this screen</b> <small>· press again to let it cross</small></span><span class="k">Shift + Scroll Lock</span></div>`);
    if (st === "secure") return desk(`<div class="osd">${icon("lock")}<span><b>Staying here while a password box is open</b> <small>· it crosses again when you leave it</small></span></div>`);
    if (st === "gone") return desk(`<div class="osd">${icon("warn")}<span><b>Desktop PC went away</b> <small>· the pointer is back on this screen</small></span><span class="x">OK</span></div>`);

    if (st === "crossing") return desk(`<div class="edgeglow"></div><div class="osd">${icon("kb")}<span><b>Using Desktop PC</b> <small>· move back left or press</small></span><span class="k">Scroll Lock</span></div>`);
    if (st === "request") return desk(osnote("Carrova · now", "Desktop PC wants to use this keyboard and mouse", "Its pointer moves here when it crosses the edge. Until you stop it or log out.", ["Decline", "Allow"]), { pip: true });
    return desk(`<div class="osd">${icon("phone")}<span><b>Pixel 8 is your touchpad and keyboard</b></span><span class="x">Stop</span></div>`);
  } });

const UPD_MB = 96.4, UPD_SPEED = 4.1;
// Download progress lives outside mount so Pause/Resume and offline keep it.
let updMb = 38.2;
const updBox = (g, tone, title, sub, inner, acts) => `<div class="ig"><div class="ig__box" style="padding:16px"><div class="row" style="gap:12px;align-items:flex-start">${glyph(icon(g), tone)}<div style="flex:1;min-inline-size:0"><b style="display:block;font-weight:650">${title}</b><span class="small sec">${sub}</span>${inner}</div></div>${acts ? `<div class="row" style="justify-content:flex-end;gap:10px;margin-top:14px">${acts}</div>` : ""}</div></div>`;
const updBar = (mb, o = {}) => `<div class="bar4${o.live ? " is-live" : ""}${o.warn ? " is-warn" : ""}"><i data-fill style="width:${(mb / UPD_MB * 100).toFixed(1)}%"></i></div>
  <div class="updnums"><span><b data-pct style="color:var(--text-primary)">${Math.round(mb / UPD_MB * 100)}%</b> · <span data-mb>${mb.toFixed(1)}</span> of ${UPD_MB} MB · <span data-speed>${o.speed || UPD_SPEED + " MB/s"}</span></span><span data-eta>${o.eta || `About ${Math.ceil((UPD_MB - mb) / UPD_SPEED)} s left`}</span></div>`;
const UPD = {
  available: () => updBox("refresh", "accent", "Carrova 0.4.0 is ready", "96.4 MB · signed by Carrova's release key · you're on 0.3.0",
    `<ul class="updnews"><li>Screens and input: share a screen, use one keyboard and mouse on two computers</li><li>Send your setup to a trusted computer without a code</li><li>Calls reconnect faster after the phone sleeps</li></ul><button class="link small" type="button" style="margin-top:8px">Full notes</button>`,
    btn("Later", { kind: "quiet" }) + btn("Install now", { kind: "primary", go: "update:downloading" })),
  downloading: () => updBox("arrowD", "accent", "Downloading Carrova 0.4.0", "Carrova keeps working while it downloads.", updBar(updMb, { live: 1 }),
    btn("Cancel", { kind: "quiet" }) + btn("Pause", { icon: "pause", go: "update:paused" })),
  paused: () => updBox("pause", "", "Download paused", "It picks up where it stopped.", updBar(updMb, { speed: "Paused", eta: "Waiting for you" }),
    btn("Cancel", { kind: "quiet" }) + btn("Resume", { kind: "primary", icon: "play", go: "update:downloading" })),
  offline: () => updBox("noNet", "warn", "Waiting for the network", "This computer lost its connection. The download carries on by itself when it's back.", updBar(updMb, { warn: 1, speed: "0 MB/s", eta: "No estimate while offline" }),
    btn("Cancel", { kind: "quiet" }) + btn("Try again", { kind: "primary", icon: "refresh", go: "update:downloading" })),
  verifying: () => updBox("shield", "accent", "Checking the signature", "Making sure this package was signed by Carrova's release key. Usually a second or two.",

  ready: () => updBox("check", "ok", "Restart to finish", "Carrova closes for a few seconds and opens on 0.4.0. Linked computers stay paired, and Pixel 8 reconnects by itself. Nothing is running that a restart would stop.", "",

  failed: () => updBox("warn", "warn", "The update didn't pass its check", "The download was damaged or wasn't signed by Carrova's release key, so it was thrown away. Nothing changed on this computer; you're still on 0.3.0.", "",
    btn("Download again", { kind: "primary", icon: "refresh", go: "update:downloading" })),
};
const updPage = (st, over) => w4({ settings: "updates", title: "Updates and about", body: `<div class="w4in">${UPD[st] ? UPD[st]() : ""}${ESECTION.updates().join("")}</div>`, over });
add({ id: "update", group: "Settings", title: "Updating Carrova", layout: "doc", states: [["notice", "Home notice"], ["available", "Ready to install"], ["downloading", "Downloading"], ["paused", "Paused"], ["offline", "Waiting for the network"], ["verifying", "Checking the signature"], ["ready", "Restart to finish"], ["blocked", "Waits for a move"], ["anyway", "Install anyway?"], ["failed", "Check failed"], ["done", "Updated"], ["tray", "Tray while downloading"]],

      <div class="req"><b>Downloading Carrova 0.4.0</b><span>40% · 4.1 MB/s · about 14 s left</span><div style="block-size:5px;border-radius:3px;background:#3a3c43;margin-top:8px;overflow:hidden"><i style="display:block;block-size:100%;inline-size:40%;background:#a3adff"></i></div><div class="osnote__acts" style="margin-top:8px"><span>Cancel</span><span>Pause</span></div></div>

const $ = s => document.querySelector(s);
let timers = [], cur = { id: "", st: "" };
const reduced = () => document.documentElement.classList.contains("rm") || matchMedia("(prefers-reduced-motion: reduce)").matches;
const clearTimers = () => { timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; };

function render() {
  const s = SCREENS.find(x => x.id === cur.id);
  const frame = $("#frame");
  frame.innerHTML = s.layout === "doc" ? s.render(cur.st) : `<div class="win" id="win"><div class="titlebar"><span class="titlebar__app">${MARK}Carrova</span><span class="titlebar__mid">${s.layout === "hub" ? "" : s.title.split(" · ")[0]}</span><span class="titlebar__ctl" aria-hidden="true"><span>${icon("min", "icon--sm")}</span><span>${icon("max", "icon--sm")}</span><span>${icon("close", "icon--sm")}</span></span></div>${s.render(cur.st)}</div>`;
  $("#sTitle").textContent = s.title;
  $("#sNote").textContent = s.note || "";
  $("#sStates").innerHTML = s.states.length > 1 ? s.states.map(([k, l]) => `<button class="pill" type="button" data-go="${s.id}:${k}" aria-current="${k === cur.st}">${l}</button>`).join("") : "";
  document.querySelectorAll(".nav__link").forEach(a => a.dataset.go.split(":")[0] === s.id && a.dataset.go.split(":")[1] === cur.st ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  clearTimers();
  runFlaps(frame);
  s.mount && s.mount(cur.st, frame);
}
function go(ref) {
  const [id, st] = (ref || "").split(":");
  const s = SCREENS.find(x => x.id === id) || SCREENS[0];
  cur = { id: s.id, st: s.states.some(([k]) => k === st) ? st : s.states[0][0] };
  const want = `${cur.id}:${cur.st}`;
  if (location.hash.slice(1) !== want) history.replaceState(null, "", "#" + want);
  render();
}
function runFlaps(root) {
  root.querySelectorAll(".code[data-reveal]").forEach(c => {
    const tiles = [...c.querySelectorAll(".flap")];
    const pool = "abcdefghijklmnopqrstuvwxyz";
    if (reduced()) { tiles.forEach(t => t.textContent = t.dataset.ch); return; }
    tiles.forEach((t, i) => {
      t.classList.add("is-spin");
      const spin = setInterval(() => { t.textContent = /\d/.test(t.dataset.ch) ? String(Math.floor(Math.random() * 10)) : pool[Math.floor(Math.random() * 26)]; }, 70);
      timers.push(spin);
      timers.push(setTimeout(() => { clearInterval(spin); t.textContent = t.dataset.ch; t.classList.remove("is-spin"); t.classList.add("is-set"); }, 380 + i * 110));
    });
  });
}
function runTransfer(root) {
  const total = 38.6, sizes = [.004, .041, .006, .18, .006, 2.3, 2.1, 34], target = 64;
  const fill = root.querySelector("[data-fill]"), pct = root.querySelector("[data-pct]"), mb = root.querySelector("[data-mb]"), eta = root.querySelector("[data-eta]"), count = root.querySelector("[data-count]"), list = root.querySelector("[data-list]");
  let p = 0, done = 0, f = 0;
  const step = () => {
    p = Math.min(target, p + (reduced() ? target : 1.6));
    fill.style.width = p + "%"; pct.textContent = Math.round(p) + "%";
    const got = total * p / 100; mb.textContent = got.toFixed(1);
    eta.textContent = `about ${Math.max(1, Math.round((total - got) / 1.9))} s left`;
    let acc = 0, n = 0; for (const s of sizes) { acc += s; if (acc <= got) n++; else break; }
    n = Math.min(n, 7);
    if (n !== done) {
      done = n; count.textContent = done;
      const within = Math.round(Math.min(95, (got - sizes.slice(0, done).reduce((a, b) => a + b, 0)) / sizes[done] * 100));
      list.innerHTML = transferList(done, within);
      const row = list.querySelector(`[data-i="${done - 1}"]`); row && row.classList.add("is-arriving");
    } else {
      const bar = list.querySelector(".minibar i");
      if (bar) bar.style.width = Math.round(Math.min(95, (got - sizes.slice(0, done).reduce((a, b) => a + b, 0)) / sizes[done] * 100)) + "%";
    }
    if (p >= target) { clearInterval(iv); }
  };
  const iv = setInterval(step, 60); timers.push(iv);
  const tk = setInterval(() => { const t = root.querySelector("[data-ticker]"); if (t) { f = (f + 1) % FILES.length; t.innerHTML = `<span>${FILES[f]}</span>`; } }, 650); timers.push(tk);
}

})();

const setDark = k => { document.documentElement.dataset.dark = k; document.querySelectorAll("[data-dark]").forEach(b => b !== document.documentElement && b.setAttribute("aria-pressed", b.dataset.dark === k)); };
setDark(new URLSearchParams(location.search).get("dark") || DEFAULT_DARK);
document.querySelectorAll("button[data-dark]").forEach(b => b.onclick = () => { setDark(b.dataset.dark); if (!document.documentElement.dataset.theme.includes("dark")) setTheme("dark"); themeLocked = true; render(); });
const setTheme = th => { document.documentElement.dataset.theme = th; $("#tTheme").setAttribute("aria-pressed", th === "dark"); };
let themeLocked = false;
const mq = matchMedia("(prefers-color-scheme: dark)");
setTheme(new URLSearchParams(location.search).get("theme") || (mq.matches ? "dark" : "light"));
mq.addEventListener("change", e => { if (!themeLocked) setTheme(e.matches ? "dark" : "light"); });
$("#tTheme").onclick = () => { themeLocked = true; setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); };
$("#tMotion").onclick = e => { const on = document.documentElement.classList.toggle("rm"); e.currentTarget.setAttribute("aria-pressed", on); render(); };
$("#tReplay").onclick = () => render();
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  const i = ALL.indexOf(`${cur.id}:${cur.st}`);
  if (e.key === "]") go(ALL[(i + 1) % ALL.length]);
  else if (e.key === "[") go(ALL[(i - 1 + ALL.length) % ALL.length]);
  else if (e.key === "t") $("#tTheme").click();
  else if (e.key === "r") render();
  else if (e.key === "Escape") { const s = SCREENS.find(x => x.id === cur.id); go(`${cur.id}:${s.states[0][0]}`); }
});
document.querySelector(".nav__brand svg").outerHTML = MARK;
window.addEventListener("hashchange", () => go(location.hash.slice(1)));
go(location.hash.slice(1) || "home:idle");
setTheme("dark"); themeLocked = true;
</script>
</body>
</html>
