<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrova desktop mockups</title>
<style>
/* =====================================================================
   1. Tokens. Every colour, size and duration used below comes from here.
   Roles, not hues: one accent; sens/danger/ok are status, never action.
   ===================================================================== */
:root {
  --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", "Noto Sans", Ubuntu, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, "JetBrains Mono", "Ubuntu Mono", monospace;

  /* type scale, ratio 1.25 on a 15px base */
  --t-sm: 13px; --t-md: 15px; --t-lg: 18px; --t-xl: 22px; --t-2xl: 28px; --t-3xl: 36px;
  --lh-tight: 1.2; --lh-body: 1.55;

  /* 8-pt spacing (4 only for hairline gaps) */
  --sp-0: 4px; --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 32px; --sp-5: 40px; --sp-6: 48px; --sp-8: 64px;

  /* radii by hierarchy */
  --r-ctl: 8px; --r-card: 14px; --r-sheet: 20px; --r-pill: 999px;

  /* motion */
  --dur-1: 120ms; --dur-2: 220ms; --dur-3: 420ms;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.3, 1.45, .5, 1);

  /* layout */
  --col: 36rem;          /* flow column */
  --page: 46rem;         /* hub page */
  --win-w: 1000px; --win-h: 680px;
}
/* ---------------------------------------------------------------------
   Semantic colour tokens: ONE table, light and dark side by side.
   Dark follows Material 3 / Primer / HIG practice: a near-black neutral
   base (never #000), elevation by progressively lighter surfaces rather
   than shadows, ~90% / ~68% / ~55% white text, borders at ~10% white,
   and an accent + status colours that are lighter and desaturated so
   they don't vibrate. Measured contrast ratios are in README.md.

   token            light      dark       role
   surface-0        #F0F2F5    #101216    wells: inputs, segmented track, logs
   surface-1        #F7F8FA    #15171C    window base
   surface-2        #FFFFFF    #1C1E24    cards, rows, chips (elevation 1)
   surface-3        #FFFFFF    #23262D    sheets, dialogs, index (elevation 2)
   text-primary     #15181D    #E4E6EA    body and headings
   text-secondary   #3E4552    #B0B4BC    supporting copy
   text-muted       #5E6672    #8E939D    metadata, hints
   border           #E3E6EB    #2C2F35    dividers (decorative)
   border-strong    #CDD2DA    #3C4048    card edges, window edge
   control          #858C98    #6E747F    edges of inputs/checkboxes/toggles (3:1)
   accent           #3346D3    #A4ADEB    the only "act" colour, links
   accent-hover     #2836B0    #BAC1F2
   accent-on        #FFFFFF    #151830    text on accent
   accent-soft      #EEF0FD    #262A45    selected, info banners
   warning          #8A5A00    #DDB76A    sensitive items (keys, scripts)
   warning-soft     #FFF4DC    #2A2519
   danger           #B42318    #EC9C92    destructive, failed
   danger-soft      #FDECEA    #2F1F1E
   success          #1F7A4D    #82C9A5    arrived, verified, encrypted
   success-soft     #E8F5EE    #1A2B23
   focus            #3346D3    #A4ADEB    focus ring (3:1 on every surface)
   --------------------------------------------------------------------- */
[data-theme="light"] {
  color-scheme: light;
  --backdrop: #E6E8EC;
  --surface-0: #F0F2F5; --surface-1: #F7F8FA; --surface-2: #FFFFFF; --surface-3: #FFFFFF;
  --text-primary: #15181D; --text-secondary: #3E4552; --text-muted: #5E6672;
  --border: #E3E6EB; --border-strong: #CDD2DA; --control: #858C98;
  --accent: #3346D3; --accent-hover: #2836B0; --accent-on: #FFFFFF; --accent-soft: #EEF0FD;
  --warning: #8A5A00; --warning-soft: #FFF4DC;
  --danger: #B42318; --danger-soft: #FDECEA;
  --success: #1F7A4D; --success-soft: #E8F5EE;
  --focus: #3346D3;
  --flap: #1B1E24; --flap-ink: #F7F8FA; --flap-seam: #0E1013; --flap-edge: transparent;
  --knob: #FFFFFF;
  --scrim: rgb(21 24 29 / .32);
  /* light: depth from soft shadows */
  --e-1: 0 1px 2px rgb(21 24 29 / .06);
  --e-2: 0 1px 2px rgb(21 24 29 / .05), 0 10px 28px -14px rgb(21 24 29 / .22);
  --e-3: 0 2px 6px rgb(21 24 29 / .08), 0 28px 64px -20px rgb(21 24 29 / .38);
}
[data-theme="dark"] {
  color-scheme: dark;
  --backdrop: #0C0D10;
  --surface-0: #101216; --surface-1: #15171C; --surface-2: #1C1E24; --surface-3: #23262D;
  --text-primary: #E4E6EA; --text-secondary: #B0B4BC; --text-muted: #8E939D;
  --border: #2C2F35; --border-strong: #3C4048; --control: #6E747F;
  --accent: #A4ADEB; --accent-hover: #BAC1F2; --accent-on: #151830; --accent-soft: #262A45;
  --warning: #DDB76A; --warning-soft: #2A2519;
  --danger: #EC9C92; --danger-soft: #2F1F1E;
  --success: #82C9A5; --success-soft: #1A2B23;
  --focus: #A4ADEB;
  --flap: #2A2D35; --flap-ink: #E4E6EA; --flap-seam: #15171C; --flap-edge: #3C4048;
  --knob: #E4E6EA;
  --scrim: rgb(8 9 11 / .6);
  /* dark: depth from lighter surfaces; shadows only separate overlays from the scrim */
  --e-1: none;
  --e-2: none;
  --e-3: 0 24px 64px -16px rgb(0 0 0 / .55);
}

/* =====================================================================
   2. Base
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { font: var(--t-md)/var(--lh-body) var(--font); color: var(--text-primary); background: var(--backdrop); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, ol, figure { margin: 0; padding: 0; }
h1, h2, h3 { line-height: var(--lh-tight); font-weight: 700; }
ul, ol { list-style: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
code, .mono { font-family: var(--mono); font-size: .93em; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-ctl); }
.vh { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.icon { inline-size: 20px; block-size: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.icon--sm { inline-size: 16px; block-size: 16px; }
.icon--lg { inline-size: 28px; block-size: 28px; }
[dir="rtl"] .icon--dir { transform: scaleX(-1); }

/* Reduced motion: set on <html> from the OS setting or the prototype toggle.
   Decorative motion stops; functional updates (progress numbers) still happen, instantly. */
.rm *, .rm *::before, .rm *::after { animation: none !important; transition: none !important; }

/* =====================================================================
   3. Components (the whole kit; see the "Design system" screen)
   ===================================================================== */

/* Text roles */
.title { font-size: var(--t-2xl); letter-spacing: -.01em; }
.title--hero { font-size: var(--t-3xl); letter-spacing: -.02em; }
.heading { font-size: var(--t-lg); }
.lede { font-size: var(--t-lg); color: var(--text-secondary); max-inline-size: 40ch; }
.muted { color: var(--text-muted); }
.small { font-size: var(--t-sm); }
.center { text-align: center; }
.stack { display: grid; gap: 12px; text-align: start; inline-size: 100%; }

/* Buttons: primary (one per screen), secondary, quiet, danger */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-1);
  min-block-size: 40px; padding-inline: var(--sp-2); border-radius: var(--r-ctl);
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-primary); font-weight: 700;
  transition: background var(--dur-1) var(--ease), transform var(--dur-1) var(--ease), border-color var(--dur-1);
}
.btn:hover { border-color: var(--text-muted); }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
.btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn--quiet { border-color: transparent; background: transparent; color: var(--accent); padding-inline: var(--sp-1); }
.btn--quiet:hover { border-color: transparent; background: var(--accent-soft); }
.btn--danger { color: var(--danger); }
.btn--danger:hover { border-color: var(--danger); }
.btn--sm { min-block-size: 32px; padding-inline: 12px; font-size: var(--t-sm); }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

/* Choice tile: the big Home choices */
.tile-choice {
  display: grid; gap: var(--sp-1); align-content: start; text-align: start;
  padding: var(--sp-3); border-radius: var(--r-card); border: 1px solid var(--border); background: var(--surface-2);
  box-shadow: var(--e-1); transition: transform var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease), border-color var(--dur-2);
}
.tile-choice:hover { transform: translateY(-2px); box-shadow: var(--e-2); border-color: var(--border-strong); }
.tile-choice__icon { inline-size: 48px; block-size: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-block-end: var(--sp-1); }
.tile-choice__title { font-size: var(--t-xl); font-weight: 700; }
.tile-choice__sub { color: var(--text-muted); }

/* Card: grouping surface. Used sparingly: lists and sheets mostly sit on the canvas. */
.card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-card); }
.card--pad { padding: var(--sp-3); }

/* List + row: the workhorse. lead | body | trail */
.list { display: grid; }
.list--card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-card); }
.row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--sp-2); padding: 12px var(--sp-2); min-block-size: 56px; }
.list--card .row + .row, .list--plain .row + .row { border-block-start: 1px solid var(--border); }
.list--plain .row, .row--flush { padding-inline: 0; }
.row__title { font-weight: 700; }
.row__sub { display: block; color: var(--text-muted); font-size: var(--t-sm); }
.row__trail { display: flex; align-items: center; gap: var(--sp-2); color: var(--text-muted); font-size: var(--t-sm); }
.row--off .row__title, .row--off .app { opacity: .55; }
.row--link { inline-size: 100%; border: 0; background: none; text-align: start; border-radius: 0; }
.row--link:hover { background: var(--surface-0); }
.row--stack { grid-template-columns: auto 1fr; }
.row--stack .row__trail { grid-column: 2; }

/* App glyph: neutral, so the accent stays the only colour that means "act" */
.app { inline-size: 40px; block-size: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-0); border: 1px solid var(--border); font: 700 13px/1 var(--mono); color: var(--text-secondary); }
.app--sm { inline-size: 28px; block-size: 28px; border-radius: 7px; font-size: 10px; }

/* Toggle */
.toggle { inline-size: 40px; block-size: 24px; border-radius: var(--r-pill); border: 0; padding: 0; background: var(--control); position: relative; flex: none; transition: background var(--dur-2) var(--ease); }
.toggle::after { content: ""; position: absolute; inset-block-start: 3px; inset-inline-start: 3px; inline-size: 18px; block-size: 18px; border-radius: 50%; background: var(--knob); box-shadow: var(--e-1); transition: inset-inline-start var(--dur-2) var(--ease-spring); }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { inset-inline-start: 19px; }

/* Checkbox (tree, checklists) */
.check { inline-size: 20px; block-size: 20px; border-radius: 6px; border: 1.5px solid var(--control); background: var(--surface-2); padding: 0; display: grid; place-items: center; flex: none; color: var(--accent-on); }
.check .icon { inline-size: 14px; block-size: 14px; stroke-width: 2.5; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset var(--dur-2) var(--ease); }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.check[aria-checked="true"] .icon { stroke-dashoffset: 0; }
.check[aria-checked="mixed"] { background: var(--accent); border-color: var(--accent); }
.check[aria-checked="mixed"]::after { content: ""; inline-size: 10px; block-size: 2px; background: var(--accent-on); border-radius: 1px; }
.check[aria-checked="mixed"] .icon { display: none; }

/* Segmented choice: explicit answers ("Leave behind" | "Bring them") */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface-0); border: 1px solid var(--border); }
.seg__opt { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-size: var(--t-sm); font-weight: 700; color: var(--text-secondary); white-space: nowrap; transition: background var(--dur-1), color var(--dur-1); }
.seg__opt[aria-checked="true"] { background: var(--surface-2); color: var(--text-primary); box-shadow: var(--e-1); }

/* Badge: status only. Phase badges are NOT in the product; see the dev index. */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; line-height: 1; padding: 5px 8px; border-radius: var(--r-pill); background: var(--surface-0); color: var(--text-secondary); white-space: nowrap; }
.badge--accent { background: var(--accent-soft); color: var(--accent); }
.badge--warning { background: var(--warning-soft); color: var(--warning); }
.badge--danger { background: var(--danger-soft); color: var(--danger); }
.badge--success { background: var(--success-soft); color: var(--success); }

/* Banner: one message, one action */
.banner { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: var(--sp-2); border-radius: var(--r-card); background: var(--surface-0); color: var(--text-primary); }
.banner > .icon { margin-block-start: 1px; }
.banner__title { font-weight: 700; }
.banner__body { color: var(--text-secondary); font-size: var(--t-sm); margin-block-start: 2px; }
.banner--warning { background: var(--warning-soft); } .banner--warning > .icon { color: var(--warning); }
.banner--danger { background: var(--danger-soft); } .banner--danger > .icon { color: var(--danger); }
.banner--success { background: var(--success-soft); } .banner--success > .icon { color: var(--success); }
.banner--accent { background: var(--accent-soft); } .banner--accent > .icon { color: var(--accent); }

/* Decision: a sensitive or blocking question in plain words */
.decision { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-1) var(--sp-2); align-items: center; padding-block: var(--sp-2); }
.decision + .decision { border-block-start: 1px solid var(--border); }
.decision__title { font-weight: 700; display: flex; gap: var(--sp-1); align-items: center; }
.decision__why { color: var(--text-secondary); font-size: var(--t-sm); grid-column: 1; max-inline-size: 46ch; }
.decision > .seg { grid-row: 1 / span 2; grid-column: 2; }
.group-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-block: var(--sp-4) var(--sp-0); }
.group-head h2 { font-size: var(--t-md); }

/* Stat: a number with a plain label */
.stats { display: flex; flex-wrap: wrap; gap: var(--sp-4); }
.stat__n { font-size: var(--t-2xl); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat__l { color: var(--text-muted); font-size: var(--t-sm); margin-block-start: var(--sp-0); }

/* Progress */
.progress { block-size: 8px; border-radius: var(--r-pill); background: var(--surface-0); border: 1px solid var(--border); overflow: hidden; }
.progress__fill { block-size: 100%; inline-size: calc(var(--p, 0) * 100%); background: var(--accent); border-radius: inherit; transition: inline-size var(--dur-3) var(--ease); }
.progress--paused .progress__fill { background: var(--text-muted); }
.progress-meta { display: flex; justify-content: space-between; gap: var(--sp-2); font-size: var(--t-sm); color: var(--text-muted); margin-block-start: var(--sp-1); font-variant-numeric: tabular-nums; }

/* App chips: what is moving, small configs first */
.chips { display: grid; gap: var(--sp-1); }
.chip { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
.chip__state { font-size: var(--t-sm); color: var(--text-muted); display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.chip[data-state="done"] .chip__state { color: var(--success); }
.chip[data-state="done"] .app { background: var(--success-soft); border-color: transparent; color: var(--success); animation: tick var(--dur-3) var(--ease-spring); }
.chip[data-state="moving"] { border-color: var(--accent); }
.chip[data-state="failed"] .chip__state { color: var(--danger); }
@keyframes tick { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

/* Lock line: the trust signal */
.lockline { display: inline-flex; align-items: center; gap: 6px; color: var(--success); font-size: var(--t-sm); font-weight: 700; }

/* Pulse dot: "waiting for the other side" */
.pulse { inline-size: 10px; block-size: 10px; border-radius: 50%; background: var(--accent); position: relative; flex: none; }
.pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--accent); animation: pulse 1.6s var(--ease) infinite; }
@keyframes pulse { from { transform: scale(1); opacity: .6; } to { transform: scale(3); opacity: 0; } }
.status { display: flex; align-items: center; gap: 12px; color: var(--text-secondary); }

/* Code tag: the one bold element. Split-flap tiles, like a station departure board. */
.code { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; direction: ltr; justify-content: center; }
.code__word { display: flex; gap: 4px; }
.code__dash { inline-size: 14px; block-size: 4px; border-radius: 2px; background: var(--text-muted); }
.flap {
  inline-size: 40px; block-size: 58px; border-radius: 8px; display: grid; place-items: center; position: relative;
  background: var(--flap); color: var(--flap-ink); font: 700 34px/1 var(--mono); text-transform: lowercase; box-shadow: var(--e-2), inset 0 0 0 1px var(--flap-edge);
}
.flap::after { content: ""; position: absolute; inset-inline: 0; inset-block-start: 50%; block-size: 2px; background: var(--flap-seam); opacity: .55; }
.flap--num { background: var(--accent); color: var(--accent-on); }
.flap.is-spinning { animation: flip 90ms linear infinite; }
.flap.is-set { animation: settle var(--dur-2) var(--ease-spring); }
@keyframes flip { 50% { transform: scaleY(.82); } }
@keyframes settle { from { transform: scaleY(.6); } to { transform: scaleY(1); } }
.code--sm .flap { inline-size: 26px; block-size: 36px; font-size: 20px; border-radius: 5px; }

/* Input */
.field { display: grid; gap: var(--sp-1); }
.field__label { font-weight: 700; }
.field__hint { font-size: var(--t-sm); color: var(--text-muted); }
.field__hint--error { color: var(--danger); }
.input { inline-size: 100%; min-block-size: 44px; padding-inline: 14px; border-radius: var(--r-ctl); border: 1px solid var(--control); background: var(--surface-0); }
.input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.input--code { font: 700 var(--t-2xl)/1 var(--mono); min-block-size: 64px; letter-spacing: .02em; }
.ghost { position: relative; }
.ghost__hint { position: absolute; inset-block: 0; inset-inline-start: 15px; display: flex; align-items: center; pointer-events: none; font: 700 var(--t-2xl)/1 var(--mono); letter-spacing: .02em; color: var(--text-muted); white-space: pre; }
.ghost__hint b { visibility: hidden; font-weight: inherit; }
.meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.meter i { block-size: 4px; border-radius: 2px; background: var(--border); }
.meter[data-level="1"] i:nth-child(-n+1) { background: var(--danger); }
.meter[data-level="3"] i:nth-child(-n+3) { background: var(--success); }
.meter[data-level="4"] i { background: var(--success); }

/* Disclosure */
.disclose > summary { cursor: pointer; color: var(--accent); font-weight: 700; list-style: none; display: inline-flex; gap: 6px; align-items: center; border-radius: var(--r-ctl); }
.disclose > summary::-webkit-details-marker { display: none; }
.disclose > summary .icon { transition: transform var(--dur-2) var(--ease); }
.disclose[open] > summary .icon { transform: rotate(90deg); }
[dir="rtl"] .disclose[open] > summary .icon { transform: scaleX(-1) rotate(90deg); }
.disclose__body { padding-block-start: 12px; }

/* Copy box: address, commands */
.copybox { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-1); padding: 6px 6px 6px 14px; padding-inline: 14px 6px; border-radius: var(--r-ctl); background: var(--surface-0); border: 1px solid var(--border); font-family: var(--mono); font-size: var(--t-sm); }
.copybox code { direction: ltr; unicode-bidi: isolate; overflow-wrap: anywhere; }

/* Empty / error state */
.empty { display: grid; justify-items: center; text-align: center; gap: var(--sp-1); padding: var(--sp-6) var(--sp-3); }
.empty__art { inline-size: 64px; block-size: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--surface-0); color: var(--text-muted); margin-block-end: var(--sp-1); }
.empty__art--danger { background: var(--danger-soft); color: var(--danger); }
.empty p { color: var(--text-muted); max-inline-size: 40ch; }
.empty .btn { margin-block-start: var(--sp-2); }

/* Key hints */
kbd, .kbd { font: 700 11px/1 var(--mono); padding: 3px 6px; border-radius: 5px; border: 1px solid var(--border-strong); border-block-end-width: 2px; background: var(--surface-2); color: var(--text-secondary); }

/* Handshake: two computers, one encrypted link */
.handshake { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--sp-2); padding-block: var(--sp-3); }
.handshake__end { display: grid; justify-items: center; gap: 6px; font-size: var(--t-sm); color: var(--text-secondary); }
.handshake__pc { inline-size: 64px; block-size: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); box-shadow: var(--e-1); color: var(--text-secondary); }
.handshake__wire { position: relative; block-size: 2px; background: repeating-linear-gradient(90deg, var(--border-strong) 0 6px, transparent 6px 12px); }
.handshake__dot { position: absolute; inset-block-start: -4px; inline-size: 10px; block-size: 10px; border-radius: 50%; background: var(--accent); animation: travel 1.4s var(--ease) infinite alternate; }
.handshake__dot:nth-child(2) { animation-delay: .7s; opacity: .5; }
@keyframes travel { from { inset-inline-start: 0; } to { inset-inline-start: calc(100% - 10px); } }
.handshake__lock { position: absolute; inset-inline-start: 50%; inset-block-start: 50%; translate: -50% -50%; inline-size: 40px; block-size: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--success); color: var(--surface-1); animation: snap var(--dur-3) var(--ease-spring); }
[dir="rtl"] .handshake__lock { translate: 50% -50%; }
.handshake.is-linked .handshake__wire { background: var(--success); }
.handshake.is-linked .handshake__pc { border-color: var(--success); }
@keyframes snap { from { scale: .2; opacity: 0; } to { scale: 1; opacity: 1; } }

/* Arrival stamp: the completion moment */
.arrival { position: relative; display: grid; place-items: center; block-size: 140px; }
.stamp {
  display: grid; justify-items: center; gap: 2px; padding: 12px 22px; border: 3px solid var(--success); border-radius: 14px;
  color: var(--success); rotate: -6deg; animation: stamp 520ms var(--ease-spring) both;
}
.stamp__word { font: 700 var(--t-2xl)/1 var(--font); letter-spacing: .02em; }
.stamp__meta { font-size: 12px; font-weight: 700; }
.burst { position: absolute; inset: 0; pointer-events: none; }
.burst i { position: absolute; inset-inline-start: 50%; inset-block-start: 50%; inline-size: 8px; block-size: 12px; border-radius: 2px; opacity: 0; animation: fly 900ms var(--ease) 220ms forwards; }
.burst i:nth-child(odd) { background: var(--accent); } .burst i:nth-child(even) { background: var(--success); }
@keyframes stamp { 0% { scale: 1.8; opacity: 0; } 60% { scale: .94; opacity: 1; } 100% { scale: 1; opacity: 1; } }
@keyframes fly { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); } }

/* Tree (Customize sheet) */
.tree { display: grid; }
.tree__row { display: grid; grid-template-columns: 24px auto 1fr auto; align-items: center; gap: 12px; padding-block: 10px; padding-inline-start: calc(var(--depth, 0) * 28px); border-block-start: 1px solid var(--border); }
.tree__row:first-child { border-block-start: 0; }
.tree__exp { border: 0; background: none; padding: 0; color: var(--text-muted); display: grid; place-items: center; }
.tree__name { min-inline-size: 0; }
.tree__name small { display: block; color: var(--text-muted); font-size: var(--t-sm); }
.tree__meta { display: flex; gap: var(--sp-1); align-items: center; font-size: var(--t-sm); color: var(--text-muted); }
.tree__row--off .tree__name { color: var(--text-muted); }

/* Timeline (session detail). A real sequence, so it is ordered. */
.timeline { display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 16px 1fr auto; gap: 12px; padding-block: 8px; position: relative; }
.timeline li::before { content: ""; inline-size: 10px; block-size: 10px; border-radius: 50%; background: var(--success); margin-block-start: 6px; margin-inline-start: 3px; }
.timeline li::after { content: ""; position: absolute; inset-inline-start: 7px; inset-block: 24px -6px; inline-size: 2px; background: var(--border); }
.timeline li:last-child::after { display: none; }
.timeline time { color: var(--text-muted); font-size: var(--t-sm); font-variant-numeric: tabular-nums; }
.log { margin: 0; padding: var(--sp-2); border-radius: var(--r-ctl); background: var(--surface-0); font: 12px/1.6 var(--mono); color: var(--text-secondary); overflow: auto; direction: ltr; text-align: left; }

/* =====================================================================
   4. Layouts: hub, flow, bare, sheet, dialog
   ===================================================================== */
.window {
  position: relative; inline-size: 100%; block-size: var(--win-h); overflow: hidden;
  display: grid; grid-template-rows: auto 1fr auto; background: var(--surface-1); border-radius: 14px;
  border: 1px solid var(--border-strong); box-shadow: var(--e-3);
}

/* Hub: a quiet top bar that recedes; the page holds focus */
.topbar { display: flex; align-items: center; gap: var(--sp-2); padding: 12px var(--sp-3); border-block-end: 1px solid var(--border); }
.wordmark { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: var(--t-lg); letter-spacing: -.01em; border: 0; background: none; padding: 0; }
.wordmark__mark { inline-size: 26px; block-size: 26px; border-radius: 8px; background: var(--accent); color: var(--accent-on); display: grid; place-items: center; }
.wordmark__mark .icon { inline-size: 16px; block-size: 16px; stroke-width: 2.25; }
.nav { display: flex; gap: var(--sp-0); margin-inline-start: auto; }
.nav__link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-ctl); border: 0; background: none; color: var(--text-muted); font-weight: 700; font-size: var(--t-sm); }
.nav__link:hover { color: var(--text-primary); background: var(--surface-0); }

.page { overflow: auto; padding: var(--sp-5) var(--sp-3); }
.page__inner { max-inline-size: var(--page); margin-inline: auto; display: grid; gap: var(--sp-3); }
.page__head { display: flex; align-items: end; justify-content: space-between; gap: var(--sp-2); flex-wrap: wrap; }

/* Flow: the nav disappears; close, where you are, one column, one action bar */
.flowbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px var(--sp-3); }
.flowbar__close { justify-self: start; }

.dots i.is-done { background: var(--accent); opacity: .45; }

.flow { overflow: auto; padding: var(--sp-3) var(--sp-3) var(--sp-4); }
.flow__col { max-inline-size: var(--col); margin-inline: auto; display: grid; gap: var(--sp-3); }
.flow__center { display: grid; gap: var(--sp-3); justify-items: center; text-align: center; }
.flow__center .lede { margin-inline: auto; }
.flow__head { display: grid; gap: var(--sp-1); }
.actions { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-block-start: 1px solid var(--border); background: var(--surface-1); }

.actions__note + .actions__end { margin-inline-start: 0; }

/* Bare: first run, nothing but the message */
.bare { grid-row: 1 / -1; display: grid; place-items: center; padding: var(--sp-5); overflow: auto; }

/* Overlays live inside the window */

  display: grid; grid-template-rows: auto 1fr auto; background: var(--surface-3); border-radius: var(--r-sheet); box-shadow: var(--e-3);

.sheet__foot .actions__note { margin-inline: 0 auto; }
.dialog {

  background: var(--surface-3); border-radius: var(--r-sheet); box-shadow: var(--e-3); padding: var(--sp-3); display: grid; gap: var(--sp-2);

.dialog--warning .dialog__icon { background: var(--warning-soft); color: var(--warning); }
.dialog--danger .dialog__icon { background: var(--danger-soft); color: var(--danger); }
.dialog h2 { font-size: var(--t-xl); }
.dialog p { color: var(--text-secondary); }

@keyframes slide-in-rtl { from { transform: translateX(-40px); opacity: 0; } }
@keyframes pop { from { scale: .94; opacity: 0; } }

.view-enter { animation: fade var(--dur-2) var(--ease); }

.home { display: grid; align-content: center; justify-items: center; gap: var(--sp-4); padding: var(--sp-5) var(--sp-3); overflow: auto; }
.home__choices { display: grid; grid-template-columns: repeat(2, minmax(0, 15.5rem)); gap: var(--sp-2); }

.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: var(--sp-2); }
.app-card { display: grid; gap: var(--sp-1); padding: var(--sp-2); border-radius: var(--r-card); border: 1px solid var(--border); background: var(--surface-2); text-align: start; }

.search { display: flex; align-items: center; gap: var(--sp-1); padding-inline: 12px; border-radius: var(--r-ctl); border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-muted); min-block-size: 40px; }

select.input { min-block-size: 36px; inline-size: auto; padding-inline: 10px; }

   ===================================================================== */
.dev { position: sticky; inset-block-start: 0; z-index: 5; display: flex; align-items: center; gap: var(--sp-1); flex-wrap: wrap; padding: 10px var(--sp-3); background: var(--backdrop); border-block-end: 1px solid var(--border-strong); font-size: var(--t-sm); }

.index { position: fixed; z-index: 10; inset-block: 0; inset-inline-start: 0; inline-size: 340px; overflow: auto; padding: var(--sp-3); background: var(--surface-3); box-shadow: var(--e-3); animation: fade var(--dur-2); }
.index[hidden] { display: none; }

.index h3 { font-size: 12px; color: var(--text-muted); margin-block: var(--sp-2) var(--sp-0); }
.index a { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-1); padding: 6px 8px; border-radius: 6px; color: var(--text-primary); text-decoration: none; font-size: var(--t-sm); }
.index a:hover { background: var(--surface-0); }
.index a[aria-current="page"] { background: var(--accent-soft); font-weight: 700; }
.phase { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: var(--r-pill); white-space: nowrap; }
.phase--ready { background: var(--success-soft); color: var(--success); }
.phase--p4 { background: var(--accent-soft); color: var(--accent); }
.phase--p5 { background: var(--surface-0); color: var(--text-secondary); border: 1px solid var(--border-strong); }
.index__legend { margin-block-start: var(--sp-3); font-size: 12px; color: var(--text-muted); display: grid; gap: 6px; }

/* Design system document */
.doc { inline-size: 100%; display: grid; gap: var(--sp-5); padding: var(--sp-5); background: var(--surface-1); border-radius: 14px; border: 1px solid var(--border-strong); }
.doc section { display: grid; gap: var(--sp-2); }
.doc h2 { font-size: var(--t-xl); }

.spacing { display: flex; align-items: end; gap: var(--sp-2); flex-wrap: wrap; font-size: 12px; color: var(--text-muted); }
.spacing i { display: block; background: var(--accent); block-size: var(--h); inline-size: var(--h); border-radius: 3px; margin-block-end: 4px; }
.layouts { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); }

/* =====================================================================
   Components. Each returns an HTML string; screens compose these only.
   ===================================================================== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const attrs = o => Object.entries(o).filter(([, v]) => v !== undefined && v !== false).map(([k, v]) => v === true ? ` ${k}` : ` ${k}="${esc(v)}"`).join("");
const icon = (name, cls = "") => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

function btn(label, { kind = "", go, size, icon: ic, iconEnd, disabled, id, needs, label: aria } = {}) {
  const cls = ["btn", kind && `btn--${kind}`, size && `btn--${size}`].filter(Boolean).join(" ");
  return `<button${attrs({ class: cls, type: "button", "data-go": go, disabled, id, "data-needs": needs, "aria-label": aria })}>${ic ? icon(ic) : ""}${label}${iconEnd ? icon(iconEnd, "icon--dir") : ""}</button>`;
}
const link = (label, go) => `<button class="link" type="button" data-go="${go}">${label}</button>`;
const app = (a, sm) => `<span class="app${sm ? " app--sm" : ""}" aria-hidden="true">${esc(a.glyph)}</span>`;
const badge = (text, tone = "") => `<span class="badge${tone ? " badge--" + tone : ""}">${text}</span>`;
const toggle = (label, on) => `<button class="toggle" type="button" role="switch" aria-checked="${on}" aria-label="${esc(label)}"></button>`;
const check = (label, on) => `<button class="check" type="button" role="checkbox" aria-checked="${on}" aria-label="${esc(label)}">${icon("check")}</button>`;
const lockline = text => `<span class="lockline">${icon("lock", "icon--sm")}${text}</span>`;
const status = text => `<p class="status" role="status"><span class="pulse" aria-hidden="true"></span>${text}</p>`;
const kbd = k => `<kbd>${k}</kbd>`;

function seg(name, options, value, required) {
  return `<div class="seg" role="radiogroup" aria-label="${esc(name)}"${required ? " data-required" : ""}>${options.map(o =>
    `<button class="seg__opt" type="button" role="radio" aria-checked="${o === value}">${o}</button>`).join("")}</div>`;
}
function row({ lead = "", title, sub = "", trail = "", cls = "", go }) {
  const inner = `${lead || "<span></span>"}<span><span class="row__title">${title}</span>${sub ? `<span class="row__sub">${sub}</span>` : ""}</span><span class="row__trail">${trail}</span>`;
  return go ? `<li><button class="row row--link ${cls}" type="button" data-go="${go}">${inner}</button></li>` : `<li class="row ${cls}">${inner}</li>`;
}
const list = (rows, kind = "card") => `<ul class="list list--${kind}">${rows.join("")}</ul>`;
function banner(tone, title, body = "", action = "") {
  const ic = { warning: "key", danger: "warn", success: "check", accent: "info" }[tone] || "info";
  return `<div class="banner banner--${tone}" role="${tone === "danger" ? "alert" : "status"}">${icon(ic)}<div><p class="banner__title">${title}</p>${body ? `<p class="banner__body">${body}</p>` : ""}</div><div>${action}</div></div>`;
}
const stat = (n, l) => `<div class="stat"><div class="stat__n">${n}</div><div class="stat__l">${l}</div></div>`;
const progress = (p, paused) => `<div class="progress${paused ? " progress--paused" : ""}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p * 100)}" aria-label="Overall progress"><div class="progress__fill" style="--p:${p}"></div></div>`;
function code(words, { reveal = false, sm = false } = {}) {
  const tiles = w => [...w].map(ch => `<span class="flap${/\d/.test(ch) ? " flap--num" : ""}" data-ch="${ch}">${reveal ? "" : ch}</span>`).join("");
  return `<div class="code${sm ? " code--sm" : ""}"${reveal ? " data-reveal" : ""} role="img" aria-label="Pairing code: ${words.join(" ")}">${words.map(w => `<span class="code__word">${tiles(w)}</span>`).join('<span class="code__dash"></span>')}</div>`;
}
function empty({ art = "info", tone = "", title, body, action = "" }) {
  return `<div class="empty"><div class="empty__art${tone ? " empty__art--" + tone : ""}">${icon(art, "icon--lg")}</div><h2 class="heading">${title}</h2><p>${body}</p>${action}</div>`;
}
function decision({ id, title, why, icon: ic = "key" }, value, opts = ["Leave behind", "Bring them"]) {
  return `<div class="decision" data-id="${id}"><p class="decision__title">${icon(ic, "icon--sm")}${title}</p><p class="decision__why">${why}</p>${seg(title, opts, value, true)}</div>`;
}
function chip(a, state, text) {
  const ic = state === "done" ? icon("check", "icon--sm") : "";
  return `<li class="chip" data-app="${a.id}" data-state="${state}">${state === "done" ? `<span class="app" aria-hidden="true">${icon("check")}</span>` : app(a)}<span><span class="row__title">${a.name}</span><span class="row__sub">${a.size}</span></span><span class="chip__state">${ic}${text}</span></li>`;
}
function handshake(linked, left = SENDER, right = RECEIVER) {
  return `<div class="handshake${linked ? " is-linked" : ""}" aria-hidden="true">
    <div class="handshake__end"><span class="handshake__pc">${icon("laptop", "icon--lg")}</span>${left}</div>
    <div class="handshake__wire">${linked ? `<span class="handshake__lock">${icon("lock")}</span>` : '<span class="handshake__dot"></span><span class="handshake__dot"></span>'}</div>
    <div class="handshake__end"><span class="handshake__pc">${icon("laptop", "icon--lg")}</span>${right}</div></div>`;
}
const arrival = (word, meta) => `<div class="arrival"><div class="stamp" role="img" aria-label="${word}"><span class="stamp__word">${word}</span><span class="stamp__meta">${meta}</span></div><div class="burst" aria-hidden="true"></div></div>`;
const copybox = text => `<div class="copybox"><code>${esc(text)}</code>${btn("Copy", { size: "sm", icon: "copy" })}</div>`;
const disclose = (summary, body, open) => `<details class="disclose"${open ? " open" : ""}><summary>${icon("chev", "icon--sm icon--dir")}${summary}</summary><div class="disclose__body">${body}</div></details>`;
const head = (title, lede = "", hero) => `<div class="flow__head"><h1 class="title${hero ? " title--hero" : ""}" tabindex="-1">${title}</h1>${lede ? `<p class="lede">${lede}</p>` : ""}</div>`;

S({ id: "send-live", group: "Send", title: "Connected, then sending", layout: "flow", flow: "send", step: 3,
  states: [["reviewing", "They're reviewing"], ["moving", "Moving"], ["reconnecting", "Reconnecting"]],

    if (st === "reviewing") return { body: `${head(`Connected to ${RECEIVER}`, "They're looking over what will change. Keep Carrova open.")}

      foot: { start: [btn("Cancel", { kind: "danger" })] } };
    return progressBody(st, "send");
  } });

function progressBody(st, side) {
  const paused = st === "paused" || st === "reconnecting";
  const p = st === "applying" ? 1 : st === "moving" ? .08 : .52;
  const chips = APPS.map((a, i) => {
    if (st === "applying") return chip(a, i < 3 ? "done" : "moving", i < 3 ? "In place" : "Putting in place…");
    if (st === "moving") return chip(a, "waiting", "Waiting");
    return chip(a, i < 4 ? "done" : paused ? "waiting" : "moving", i < 4 ? "Arrived" : paused ? "Paused" : "612 MB of 1.2 GB");
  });
  const title = { moving: "Moving your setup", paused: "Paused: this disk is full", reconnecting: "Lost the connection", applying: "Putting things in place" }[st];
  const lede = { moving: "Small settings go first, so most apps are done in seconds.", paused: "Carrova kept everything that arrived. Free up 400 MB and it picks up where it stopped.", reconnecting: "Trying again. It'll pick up where it left off, even after sleep or a restart.", applying: "Replaced files are backed up first. If anything goes wrong, Carrova undoes it automatically." }[st];
  const meta = st === "applying" ? ["1.2 GB arrived", "Almost done"] : paused ? ["612 MB of 1.2 GB", st === "paused" ? "Waiting for space" : "Retrying for up to 10 minutes"] : ["0 of 1.2 GB", "About 2 minutes left"];
  return { body: `${head(title, lede)}
    ${st === "paused" ? banner("danger", "400 MB more space needed", "Checked every 5 seconds.", btn("Open Files", { size: "sm" })) : ""}
    <div>${progress(p, paused)}<div class="progress-meta"><span data-sim-done>${meta[0]}</span><span data-sim-left>${meta[1]}</span></div></div>
    <ul class="chips"${st === "moving" ? " data-sim" : ""}>${chips.join("")}</ul>
    ${lockline(side === "send" ? `Encrypted. Only ${RECEIVER} can read this.` : `Encrypted. Each piece is checked as it arrives.`)}`,
    foot: { start: [st === "paused" ? btn("Ignore the space check", { kind: "quiet", go: "override:space" }) : btn("Cancel", { kind: "danger" })],
      end: [st === "moving" ? btn("Pause", { icon: "pause" }) : "", st === "applying" ? btn("See what arrived", { kind: "primary", go: side === "send" ? "send-done" : "recv-done:done" }) : ""] } };
}

/* =====================================================================
   Design system document (reads the live tokens, so it never drifts)
   ===================================================================== */
function designSystem() {
  const roles = ["surface-0", "surface-1", "surface-2", "surface-3", "text-primary", "text-secondary", "text-muted", "border", "border-strong", "control", "accent", "accent-on", "accent-soft", "warning", "warning-soft", "danger", "danger-soft", "success", "success-soft", "focus"];
  const sw = roles.map(r => `<div class="swatch"><div class="swatch__chip" style="background:var(--${r})"></div><div class="swatch__meta"><b>--${r}</b><code data-token="--${r}"></code></div></div>`).join("");
  const type = [["--t-3xl", "Hero 36"], ["--t-2xl", "Title 28"], ["--t-xl", "Heading 22"], ["--t-lg", "Lede 18"], ["--t-md", "Body 15"], ["--t-sm", "Small 13"]].map(([v, l]) => `<p style="font-size:var(${v});font-weight:${/Body|Small|Lede/.test(l) ? 400 : 700}">${l}: Bring your setup along</p>`).join("");
  const sp = [4, 8, 16, 24, 32, 40, 48, 64].map((n, i) => `<span><i style="--h:${n}px"></i>${["sp-0", "sp-1", "sp-2", "sp-3", "sp-4", "sp-5", "sp-6", "sp-8"][i]} ${n}</span>`).join("");
  const mini = (cap, parts) => `<div><div class="mini" aria-hidden="true">${parts}</div><p class="mini-cap"><b>${cap[0]}</b> <span class="muted">${cap[1]}</span></p></div>`;
  return `<article class="doc" aria-labelledby="dsH">
  <header><h1 class="title" id="dsH" tabindex="-1">Carrova design system</h1><p class="lede">One accent that means "act". Status colours that never mean "act". 8-point spacing, a 1.25 type scale and four layouts.</p></header>
  <section><h2>Colour roles</h2><p class="muted small">Switch the theme in the bar above; values update live. All text pairs meet WCAG AA.</p><div class="swatches">${sw}</div></section>
  <section><h2>Type</h2><p class="muted small">Atkinson Hyperlegible (falls back to the system font), chosen so codes can't be misread. Monospace only for paths, codes and logs.</p>${type}</section>
  <section><h2>Spacing, radius and depth</h2><div class="spacing">${sp}</div>
    <div class="specimen"><div class="card card--pad" style="border-radius:var(--r-ctl)">control 8</div><div class="card card--pad">card 14</div><div class="card card--pad" style="border-radius:var(--r-sheet);box-shadow:var(--e-3)">sheet 20, elevation 3</div></div></section>
  <section><h2>Layouts</h2><div class="layouts">
    ${mini(["Hub", "quiet top bar, page"], '<b style="inset:6px 6px auto;block-size:10px"></b><b style="inset:26px 22% auto;block-size:40%"></b>')}
    ${mini(["Flow", "close, dots, column, action bar"], '<b style="inset:6px auto auto 6px;inline-size:10px;block-size:10px"></b><b style="inset:28px 28% auto;block-size:44%"></b><b class="a" style="inset:auto 6px 6px auto;inline-size:28%;block-size:12px"></b>')}
    ${mini(["Sheet", "drill-down from the end"], '<b style="inset:20px 30% auto 6px;block-size:50%"></b><b class="a" style="inset:4px 4px 4px 55%;opacity:.25"></b>')}
    ${mini(["Dialog", "warnings, confirmations"], '<b style="inset:30% 22%;opacity:.4"></b><b class="a" style="inset:auto 26% 34% auto;inline-size:20%;block-size:10px"></b>')}</div></section>
  <section><h2>Components</h2>
    <h3>Buttons. One primary per screen.</h3><div class="specimen">${btn("Approve and move", { kind: "primary" })}${btn("Customize")}${btn("Show a new code", { kind: "quiet" })}${btn("Cancel", { kind: "danger" })}${btn("Copy", { size: "sm", icon: "copy" })}</div>
    <h3>Controls</h3><div class="specimen">${toggle("Example on", true)}${toggle("Example off", false)}${check("Checked", true)}${check("Mixed", "mixed")}${check("Unchecked", false)}${seg("Example", ["Leave behind", "Bring them"], "Leave behind")}</div>
    <h3>Badges (status only)</h3><div class="specimen">${badge("Suggested")}${badge("Undo until 8 Dec", "accent")}${badge("Sensitive", "warning")}${badge("Unsigned", "danger")}${badge("Enough", "success")}</div>
    <h3>Banners. One message, one action.</h3>${banner("accent", "The other computer can't find this one", "Type the address instead.")}${banner("warning", "A wrong code was typed, so we made a new one")}${banner("danger", "400 MB more space needed", "", btn("Open Files", { size: "sm" }))}${banner("success", "Signature verified")}
    <h3>List rows and decisions</h3>${list([row({ lead: app(APPS[1]), title: "SSH", sub: "Server list and shortcuts", trail: `<span>14 KB</span>${toggle("SSH", true)}` }), row({ lead: icon("swap"), title: "Drill-down row", sub: "Opens a sheet", trail: icon("chev", "icon--dir"), go: "review-details" })])}${decision(ASKS[0], "Leave behind")}
    <h3>Code tag, progress, chips, trust</h3>${code(CODE, { sm: true })}<div>${progress(.6)}<div class="progress-meta"><span>720 MB of 1.2 GB</span><span>About a minute left</span></div></div><ul class="chips">${chip(APPS[0], "done", "Arrived")}${chip(APPS[4], "moving", "612 MB of 1.2 GB")}</ul>${lockline("Encrypted. Only ezio-thinkpad-new can read this.")}${status("Waiting for ezio-thinkpad-new…")}
    <h3>Empty and error states</h3><div class="card">${empty({ art: "history", title: "No moves yet", body: "When you send or receive, it shows up here.", action: btn("Receive", { kind: "primary" }) })}</div>
    <h3>Key hints</h3><p>${kbd("Tab")} next ${kbd("Enter")} primary action ${kbd("Esc")} close sheet ${kbd("Space")} toggle</p></section>
  <section><h2>Motion</h2><ul class="rules">
    <li>120 ms for presses, 220 ms for state changes, 420 ms for sheets and progress. Spring easing only where something lands (toggle, stamp, lock).</li>
    <li>Three signature moments, one per flow: the split-flap code, the handshake lock, the arrival stamp. Nothing else animates on its own.</li>
    <li>Reduced motion: every animation stops; progress numbers still update, instantly.</li></ul></section>
  <section><h2>Rules for new screens</h2><ul class="rules">
    <li>Pick a layout. Hub for places, Flow for tasks, Sheet for detail, Dialog for a risk or confirmation.</li>
    <li>One primary button, at the end of the action bar. Its label says what happens ("Approve and move", not "Next").</li>
    <li>Hide controls, never consequences. Defaults are written out in words with a way to change them.</li>
    <li>Amber means sensitive, red means destructive or failed, the accent means act. Nothing else gets colour.</li>
    <li>Logical properties only (inline/block), so right-to-left mirrors for free. Paths and codes stay left-to-right.</li></ul></section>
  </article>`;
}

/* =====================================================================
   Renderer + router
   ===================================================================== */
const $ = s => document.querySelector(s);
const byId = id => SCREENS.find(s => s.id === id);
const firstState = s => (s.states[0] || [])[0] || "";
const NAV = [["home", "Home", "swap", "home:returning"], ["history", "History", "history", "history:list"], ["apps", "Apps", "apps", "apps:verified"], ["settings", "Settings", "settings", "settings"]];

function renderView(scr, st) {
  if (scr.base) {
    const ref = typeof scr.base === "function" ? scr.base(st) : scr.base;
    const [bid, bst] = ref.split(":");
    const base = byId(bid);
    return renderView(base, bst || firstState(base)) + overlay(scr.overlay(st), ref);
  }
  const v = scr.render(st);
  if (scr.layout === "bare") return `<div class="bare">${v.body}</div>`;
  if (scr.layout === "hub") {
    const nav = NAV.map(([id, l, ic, go]) => `<button class="nav__link" type="button" data-go="${go}"${id === scr.nav ? ' aria-current="page"' : ""}>${icon(ic, "icon--sm")}<span>${l}</span></button>`).join("");
    return `<header class="topbar"><button class="wordmark" type="button" data-go="home:returning"><span class="wordmark__mark">${icon("swap")}</span>Carrova</button><nav class="nav" aria-label="Main">${nav}</nav></header>
      ${v.raw || `<div class="page"><div class="page__inner">${v.body}</div></div>`}<span></span>`;
  }
  const [name, n] = FLOWS[scr.flow];
  const dots = Array.from({ length: n }, (_, i) => `<i class="${i + 1 < scr.step ? "is-done" : i + 1 === scr.step ? "is-now" : ""}"></i>`).join("");
  const f = v.foot || {};
  const foot = `<footer class="actions">${(f.start || []).join("")}${f.note ? `<span class="actions__note" aria-live="polite">${f.note}</span>` : ""}<span class="actions__end">${(f.end || []).join("")}</span></footer>`;
  return `<header class="flowbar"><span class="flowbar__close">${btn("", { kind: "quiet", icon: "close", go: "home:returning", label: "Close and go home" })}</span>
    <span class="flowbar__name">${name}</span><span class="dots" role="img" aria-label="Step ${scr.step} of ${n}">${dots}</span></header>
    <div class="flow"><div class="flow__col">${v.body}</div></div>${foot}`;
}

function overlay(o, back) {
  if (o.kind === "dialog") return `<div class="scrim" data-go="${back}"></div><section class="dialog dialog--${o.tone || "accent"}" role="dialog" aria-modal="true" aria-labelledby="ovH">
    <span class="dialog__icon">${icon(o.icon || "info")}</span><h2 id="ovH" tabindex="-1">${o.title}</h2>${o.body}<div class="dialog__foot">${o.foot.join("")}</div></section>`;
  return `<div class="scrim" data-go="${back}"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="ovH">
    <header class="sheet__head"><h2 id="ovH" tabindex="-1">${o.title}</h2>${btn("", { kind: "quiet", icon: "close", go: back, label: "Close" })}</header>
    <div class="sheet__body">${o.body}</div><footer class="sheet__foot">${o.foot.join("")}</footer></section>`;
}

let cur = { id: "", st: "" }, timers = [];
const reduced = () => document.documentElement.classList.contains("rm");

function go(ref, { focus = true } = {}) {
  const [id, st0] = ref.split(":");
  const scr = byId(id) || SCREENS.find(s => s.id === "home");
  const st = scr.states.some(([k]) => k === st0) ? st0 : firstState(scr);
  cur = { id: scr.id, st };
  timers.forEach(clearInterval); timers = [];
  const frame = $("#frame");
  frame.innerHTML = scr.layout === "doc" ? scr.render(st).raw
    : `<div class="window view-enter" id="win" dir="${$("#tRtl").getAttribute("aria-pressed") === "true" ? "rtl" : "ltr"}">${renderView(scr, st)}</div>`;
  $("#states").innerHTML = scr.states.map(([k, l]) => `<button class="btn btn--sm" type="button" data-go="${scr.id}:${k}" aria-current="${k === st}">${l}</button>`).join("");
  $("#note").textContent = scr.note || "";
  const phase = { ready: "engine ready", p4: "Phase 4", p5: "Phase 5" }[scr.phase];
  $("#where").innerHTML = `<b>${scr.title}</b><span class="phase phase--${scr.phase}">${phase}</span>`;
  document.querySelectorAll("#index a").forEach(a => a.dataset.id === scr.id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const want = st && scr.states.length ? `${scr.id}:${st}` : scr.id;
  if (location.hash.slice(1) !== want) history.replaceState(null, "", "#" + want);
  mount(frame);
  if (focus) (frame.querySelector("#ovH") || frame.querySelector("[tabindex='-1']"))?.focus({ preventScroll: true });
}

/* ---------- Behaviours attached after each render ---------- */
function mount(root) {
  root.querySelectorAll(".code[data-reveal]").forEach(revealCode);
  root.querySelectorAll(".burst").forEach(burst);
  root.querySelectorAll("[data-sim]").forEach(simulate);
  const codeIn = root.querySelector("#codeIn");
  if (codeIn) autocomplete(codeIn);
  root.querySelectorAll("[data-token]").forEach(el => { el.textContent = getComputedStyle(document.documentElement).getPropertyValue(el.dataset.token).trim(); });
  updateNeeds(root);
}

function revealCode(el) {
  const flaps = [...el.querySelectorAll(".flap")];
  const set = f => { f.textContent = f.dataset.ch; f.classList.remove("is-spinning"); f.classList.add("is-set"); };
  if (reduced()) return flaps.forEach(set);
  const abc = "abcdefghijklmnopqrstuvwxyz";
  flaps.forEach((f, i) => {
    f.classList.add("is-spinning");
    const t = setInterval(() => { f.textContent = /\d/.test(f.dataset.ch) ? String(Math.floor(Math.random() * 10)) : abc[Math.floor(Math.random() * 26)]; }, 60);
    timers.push(t);
    setTimeout(() => { clearInterval(t); set(f); }, 350 + i * 70);
  });
}

function burst(el) {
  if (reduced()) return;
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2, r = 90 + (i % 3) * 30;
    const p = document.createElement("i");
    p.style.setProperty("--dx", `${Math.cos(a) * r}px`); p.style.setProperty("--dy", `${Math.sin(a) * r * .6}px`); p.style.setProperty("--rot", `${(i * 47) % 360}deg`);
    el.append(p);
  }
}

/* Small-first progress: chips tick off early, the big one carries the bar. */
function simulate(chips) {
  const bar = chips.parentElement.querySelector(".progress__fill"), pb = chips.parentElement.querySelector(".progress");
  const done = chips.parentElement.querySelector("[data-sim-done]"), left = chips.parentElement.querySelector("[data-sim-left]");
  const marks = [.005, .012, .02, .04, 1];
  let p = 0;
  const stepTo = target => {
    p = target;
    bar.style.setProperty("--p", p); pb.setAttribute("aria-valuenow", Math.round(p * 100));
    done.textContent = `${Math.round(p * 1200)} MB of 1.2 GB`;
    left.textContent = p > .6 ? "About a minute left" : "About 2 minutes left";
    chips.querySelectorAll(".chip").forEach((c, i) => {
      const was = c.dataset.state, now = p >= marks[i] ? "done" : (i === 0 || p >= marks[i - 1]) ? "moving" : "waiting";
      if (was === now) return;
      c.dataset.state = now;
      c.querySelector(".chip__state").innerHTML = now === "done" ? `${icon("check", "icon--sm")}Arrived` : now === "moving" ? (i === 4 ? `${Math.round(p * 1200)} MB of 1.2 GB` : "Moving") : "Waiting";
      if (now === "done") c.querySelector(".app").innerHTML = icon("check");
    });
    const vs = chips.querySelector('[data-app="vscode"][data-state="moving"] .chip__state');
    if (vs) vs.textContent = `${Math.round(p * 1200)} MB of 1.2 GB`;
  };
  if (reduced()) return stepTo(.62);
  const t = setInterval(() => { stepTo(Math.min(.62, p + (p < .05 ? .004 : .02))); if (p >= .62) clearInterval(t); }, 160);
  timers.push(t);
}

function autocomplete(input) {
  const hint = input.parentElement.querySelector(".ghost__hint");
  const update = () => {
    const v = input.value, last = v.split(/[-\s]/).pop();
    const m = last.length >= 3 ? WORDS.find(w => w.startsWith(last.toLowerCase())) : null;
    hint.innerHTML = m && m !== last ? `<b>${esc(v)}</b>${m.slice(last.length)}` : "";
  };
  input.addEventListener("input", update);
  input.addEventListener("keydown", e => {
    const v = input.value, last = v.split(/[-\s]/).pop();
    const m = last.length >= 3 ? WORDS.find(w => w.startsWith(last.toLowerCase())) : null;
    if ((e.key === "Tab" || e.key === "ArrowRight") && m && m !== last) { e.preventDefault(); input.value = v.slice(0, v.length - last.length) + m + (v.split("-").length < 3 ? "-" : ""); update(); }
    if (e.key === "Enter") go("recv-code:connecting");
  });
  update();
}

/* Primary actions gated on decisions: enabled when every required choice has an answer */
function updateNeeds(root) {
  root.querySelectorAll("[data-needs='decisions']").forEach(b => {
    const groups = [...root.querySelectorAll(".seg[data-required]")];
    const left = groups.filter(g => !g.querySelector('[aria-checked="true"]')).length;
    b.disabled = left > 0;
    const note = root.querySelector(".actions__note"), tag = root.querySelector("[data-left]");
    if (note) note.textContent = left ? `Answer ${left} question${left > 1 ? "s" : ""} to continue` : "";
    if (tag) tag.textContent = left ? `${left} to answer` : "All answered";
  });
}

/* ---------- Event wiring ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go], [role=switch], [role=checkbox], [role=radio]");
  if (!t || t.disabled) return;
  if (t.matches("[role=switch], [role=checkbox]")) { t.setAttribute("aria-checked", String(t.getAttribute("aria-checked") !== "true")); return; }
  if (t.matches("[role=radio]")) {
    t.parentElement.querySelectorAll("[role=radio]").forEach(r => r.setAttribute("aria-checked", String(r === t)));
    updateNeeds($("#frame")); return;
  }
  if (t.closest("#index")) closeIndex();
  go(t.dataset.go);
});
document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey || e.target.matches("input, select, textarea")) return;
  const i = SCREENS.findIndex(s => s.id === cur.id);
  if (e.key === "]") go(SCREENS[(i + 1) % SCREENS.length].id);
  if (e.key === "[") go(SCREENS[(i - 1 + SCREENS.length) % SCREENS.length].id);
  if (e.key === "i") $("#index").hidden ? openIndex() : closeIndex();
  if (e.key === "Escape") { if (!$("#index").hidden) return closeIndex(); const s = byId(cur.id); if (s.base) go(typeof s.base === "function" ? s.base(cur.st) : s.base); }
});
window.addEventListener("hashchange", () => go(location.hash.slice(1)));

function buildIndex() {
  const groups = [...new Set(SCREENS.map(s => s.group))];
  $("#index").innerHTML = `<div class="index__head"><b>Screen index</b>${btn("", { kind: "quiet", icon: "close", label: "Close index", id: "closeIdx" })}</div>
    ${groups.map(g => `<h3>${g}</h3><ul>${SCREENS.filter(s => s.group === g).map(s => `<li><a href="#${s.id}" data-id="${s.id}"><span>${s.title}</span><span class="phase phase--${s.phase}">${{ ready: "ready", p4: "P4", p5: "P5" }[s.phase]}</span></a></li>`).join("")}</ul>`).join("")}
    <div class="index__legend"><span><span class="phase phase--ready">ready</span> the engine and CLI already do this</span><span><span class="phase phase--p4">P4</span> comes with the desktop app</span><span><span class="phase phase--p5">P5</span> after v0.1</span><span>Phase badges exist only here, never in the product.</span></div>`;
  $("#closeIdx").addEventListener("click", closeIndex);
  $("#index").addEventListener("click", e => { if (e.target.closest("a")) closeIndex(); });
}
function openIndex() { $("#index").hidden = false; $("#openIndex").setAttribute("aria-expanded", "true"); $("#index a[aria-current='page']")?.focus() || $("#index a")?.focus(); }
function closeIndex() { $("#index").hidden = true; $("#openIndex").setAttribute("aria-expanded", "false"); $("#openIndex").focus(); }

function toggleBtn(id, fn) {
  const b = $(id);
  b.addEventListener("click", () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); fn(on); });
  return b;
}
const mq = matchMedia("(prefers-reduced-motion: reduce)");
const syncMotion = () => document.documentElement.classList.toggle("rm", mq.matches || $("#tMotion").getAttribute("aria-pressed") === "true");
mq.addEventListener("change", syncMotion);

buildIndex();
$("#openIndex").addEventListener("click", () => $("#index").hidden ? openIndex() : closeIndex());
$("#prev").addEventListener("click", () => { const i = SCREENS.findIndex(s => s.id === cur.id); go(SCREENS[(i - 1 + SCREENS.length) % SCREENS.length].id); });
$("#next").addEventListener("click", () => { const i = SCREENS.findIndex(s => s.id === cur.id); go(SCREENS[(i + 1) % SCREENS.length].id); });
/* Theme: follows the OS by default (and live), until the toggle is used. */
const mqDark = matchMedia("(prefers-color-scheme: dark)");
let themeChosen = false;
const setTheme = dark => { document.documentElement.dataset.theme = dark ? "dark" : "light"; $("#tTheme").setAttribute("aria-pressed", String(dark)); if (cur.id) go(`${cur.id}:${cur.st}`, { focus: false }); };
toggleBtn("#tTheme", on => { themeChosen = true; setTheme(on); });
mqDark.addEventListener("change", () => { if (!themeChosen) setTheme(mqDark.matches); });
toggleBtn("#tRtl", on => { const w = $("#win"); if (w) w.dir = on ? "rtl" : "ltr"; });
toggleBtn("#tMotion", () => { syncMotion(); go(`${cur.id}:${cur.st}`, { focus: false }); });
setTheme(mqDark.matches);
syncMotion();
go(location.hash.slice(1) || "home:returning", { focus: false });
</script>
</body>
