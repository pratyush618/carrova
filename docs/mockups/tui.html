<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrova terminal UI mockups</title>
<style>
  /* Page tokens: same semantic table as gui.html (see README "Colour tokens"). */
  :root {
    --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, "Noto Sans", Ubuntu, sans-serif;
    --mono: "Atkinson Hyperlegible Mono", ui-monospace, "JetBrains Mono", "Ubuntu Mono", monospace;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --surface-0: #F0F2F5; --surface-1: #F7F8FA; --surface-2: #FFFFFF;
    --text-primary: #15181D; --text-secondary: #3E4552; --text-muted: #5E6672;
    --border: #E3E6EB; --control: #858C98;
    --accent: #3346D3; --accent-soft: #EEF0FD; --focus: #3346D3;
    --success: #1F7A4D; --success-soft: #E8F5EE;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #101216; --surface-1: #15171C; --surface-2: #1C1E24;
    --text-primary: #E4E6EA; --text-secondary: #B0B4BC; --text-muted: #8E939D;
    --border: #2C2F35; --control: #6E747F;
    --accent: #A4ADEB; --accent-soft: #262A45; --focus: #A4ADEB;
    --success: #82C9A5; --success-soft: #1A2B23;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-1); color: var(--text-primary); font: 15px/1.5 var(--font); }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  .topbar { display: flex; align-items: center; gap: 16px; padding-block: 12px; padding-inline: 24px; border-block-end: 1px solid var(--border); }
  .topbar h1 { font-size: 16px; margin: 0; }
  .topbar .spacer { flex: 1; }
  .btn { font: inherit; font-size: 13px; font-weight: 700; color: var(--text-primary); background: var(--surface-2); border: 1px solid var(--control); border-radius: 8px; padding-block: 5px; padding-inline: 12px; cursor: pointer; }
  .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

  .layout { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-block-size: calc(100vh - 56px); }
  .index { border-inline-end: 1px solid var(--border); padding: 16px 12px; overflow-y: auto; max-block-size: calc(100vh - 56px); position: sticky; inset-block-start: 0; }
  .index h2 { font-size: 12px; color: var(--text-muted); margin-block: 16px 4px; margin-inline: 8px; }
  .index h2:first-child { margin-block-start: 0; }
  .index ol { list-style: none; margin: 0; padding: 0; }
  .index a { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; text-decoration: none; color: var(--text-primary); font-size: 13px; padding: 4px 8px; border-radius: 6px; }
  .index a:hover { background: var(--surface-0); }
  .index a[aria-current="page"] { background: var(--accent-soft); font-weight: 700; }
  /* Phase badges live only in this dev index, never in the product UI. */
  .badge { flex: none; font-size: 11px; font-weight: 700; line-height: 1.6; padding-inline: 6px; border-radius: 999px; white-space: nowrap; }
  .badge.ready { color: var(--success); background: var(--success-soft); }
  .badge.p4 { color: var(--accent); background: var(--accent-soft); }
  .badge.p5 { color: var(--text-secondary); background: var(--surface-0); border: 1px solid var(--border); }

  main { padding-block: 24px 40px; padding-inline: 32px; min-inline-size: 0; }
  .screen-head { display: flex; align-items: center; gap: 12px; margin-block-end: 16px; }
  .screen-head h2 { font-size: 22px; margin: 0; }
  .screen-head .group { color: var(--text-muted); font-size: 14px; }

  /* Terminal palettes. Dark is the default terminal: near-black neutral, ~90% white text,
     desaturated accent/status colours (same hues as the GUI dark tokens). */
  .term {
    --t-bg: #15171C; --t-fg: #E4E6EA; --t-dim: #8E939D; --t-acc: #A4ADEB; --t-sens: #DDB76A; --t-err: #EC9C92; --t-ok: #82C9A5;
    --t-sel: #262A45; --t-tile: #2A2D35; --t-hdr: #1C1E24; --t-pop: #23262D; --t-line: #4A4F59; --t-shadow: #0C0D10; --t-chrome: #1C1E24;
    display: inline-block; max-inline-size: 100%; border-radius: 12px; overflow: hidden; border: 1px solid #2C2F35; background: var(--t-bg);
  }
  .term.light {
    --t-bg: #F7F8FA; --t-fg: #15181D; --t-dim: #5E6672; --t-acc: #3346D3; --t-sens: #8A5A00; --t-err: #B42318; --t-ok: #1F7A4D;
    --t-sel: #E4E7FB; --t-tile: #DDE1E8; --t-hdr: #ECEEF2; --t-pop: #FFFFFF; --t-line: #A9B0BA; --t-shadow: #DCDFE5; --t-chrome: #E6E8EC;
    border-color: #CDD2DA;
  }
  .term-bar { display: flex; align-items: center; gap: 7px; padding: 8px 12px; background: var(--t-chrome); color: var(--t-dim); font: 12px/1 var(--mono); }
  .term-bar i { inline-size: 11px; block-size: 11px; border-radius: 50%; background: var(--t-line); display: inline-block; }
  .term-bar span { margin-inline-start: 10px; }
  .term-scroll { overflow-x: auto; }
  pre.screen { margin: 0; padding: 6px 8px; font-family: var(--mono); font-size: clamp(9px, 1.02vw, 14px); line-height: 1.32; color: var(--t-fg); background: var(--t-bg); white-space: pre; inline-size: max-content; direction: ltr; }
  pre.screen .g { display: inline-block; inline-size: 1ch; text-align: center; overflow: hidden; vertical-align: bottom; }
  .t-dim { color: var(--t-dim); } .t-acc { color: var(--t-acc); } .t-sens { color: var(--t-sens); } .t-err { color: var(--t-err); } .t-ok { color: var(--t-ok); }
  .t-line { color: var(--t-line); } .t-b { font-weight: 700; } .t-u { text-decoration: underline; } .t-key { color: var(--t-acc); font-weight: 700; }
  .t-hdr { background: var(--t-hdr); } .t-pop { background: var(--t-pop); } .t-sel { background: var(--t-sel); }
  .t-inv { background: var(--t-acc); color: var(--t-bg); font-weight: 700; }
  .t-tile { background: var(--t-tile); color: var(--t-fg); font-weight: 700; }
  .t-shadow { background: var(--t-shadow); }

  .note { max-inline-size: 75ch; margin-block: 16px 0; color: var(--text-secondary); }
  .pager { display: flex; gap: 10px; margin-block-start: 16px; align-items: center; }
  .pager .hint { color: var(--text-muted); font-size: 13px; }
  kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--control); border-block-end-width: 2px; border-radius: 4px; padding-inline: 5px; background: var(--surface-2); }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .index { position: static; max-block-size: none; border-inline-end: 0; border-block-end: 1px solid var(--border); }
    main { padding-inline: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <h1>Carrova terminal UI</h1>
  <a href="gui.html">Desktop app mockups</a>
  <span class="spacer"></span>
  <button class="btn" id="termPalette" aria-pressed="false">Light terminal</button>
  <button class="btn" id="pageTheme" aria-pressed="false">Dark page</button>
</header>
<div class="layout">
  <nav class="index" id="index" aria-label="Screen index"></nav>
  <main>
    <div class="screen-head">
      <h2 id="screenTitle" tabindex="-1"></h2>
      <span class="badge" id="screenBadge"></span>
      <span class="group" id="screenGroup"></span>
    </div>
    <div class="term" id="term">
      <div class="term-bar" aria-hidden="true"><i></i><i></i><i></i><span>carrova — 100×30</span></div>
      <div class="term-scroll"><pre class="screen" id="screen" role="img" aria-label="Terminal screen"></pre></div>
    </div>
    <p class="note" id="screenNote"></p>
    <div class="pager">
      <button class="btn" id="prev">Previous screen</button>
      <button class="btn" id="next">Next screen</button>
      <span class="hint"><kbd>←</kbd> <kbd>→</kbd> also step through screens</span>
    </div>
  </main>
</div>

<script>
"use strict";

/* ---------- Cell buffer renderer ---------- */

const W = 100;
const H = 30;
const SPIN = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";

class Buf {
  constructor() {
    this.bg = "";
    this.cells = [];
    for (let y = 0; y < H; y++) {
      this.cells.push(Array.from({ length: W }, () => [" ", ""]));
    }
  }
  cls(c) {
    return [c, this.bg].filter(Boolean).join(" ");
  }
  put(x, y, s, c = "", max = Infinity) {
    if (y < 0 || y >= H) return x;
    const chars = [...s];
    const n = Math.min(chars.length, max);
    const k = this.cls(c);
    for (let i = 0; i < n; i++) {
      const xx = x + i;
      if (xx >= 0 && xx < W) this.cells[y][xx] = [chars[i], k];
    }
    return x + n;
  }
  putR(xEnd, y, s, c = "") {
    return this.put(xEnd - [...s].length, y, s, c);
  }
  center(y, s, c = "", x0 = 0, w = W) {
    return this.put(x0 + Math.floor((w - [...s].length) / 2), y, s, c);
  }
  clear(x, y, w, h, c = "") {
    for (let j = y; j < y + h; j++) this.put(x, j, " ".repeat(w), c);
  }
  addClass(x, y, w, h, c) {
    for (let j = y; j < Math.min(y + h, H); j++) {
      for (let i = x; i < Math.min(x + w, W); i++) {
        const cell = this.cells[j][i];
        cell[1] = [cell[1], c].filter(Boolean).join(" ");
      }
    }
  }
  box(x, y, w, h, title = "", o = {}) {
    const set = o.double ? "╔╗╚╝═║" : o.rounded ? "╭╮╰╯─│" : "┌┐└┘─│";
    const c = o.cls || "line";
    if (o.fill !== undefined) this.clear(x + 1, y + 1, w - 2, h - 2, o.fill);
    this.put(x, y, set[0] + set[4].repeat(w - 2) + set[1], c);
    this.put(x, y + h - 1, set[2] + set[4].repeat(w - 2) + set[3], c);
    for (let j = y + 1; j < y + h - 1; j++) {
      this.put(x, j, set[5], c);
      this.put(x + w - 1, j, set[5], c);
    }
    if (title) this.put(x + 2, y, " " + title + " ", o.tcls || "b");
  }
  bar(x, y, w, frac, c = "acc") {
    const n = Math.round(w * Math.max(0, Math.min(1, frac)));
    this.put(x, y, "█".repeat(n), c);
    this.put(x + n, y, "░".repeat(w - n), "line");
  }
  wrap(x, y, w, text, c = "") {
    let line = "";
    for (const word of text.split(" ")) {
      if (line && (line + " " + word).length > w) {
        this.put(x, y++, line, c);
        line = word;
      } else {
        line = line ? line + " " + word : word;
      }
    }
    if (line) this.put(x, y++, line, c);
    return y;
  }
  toHTML() {
    return this.cells.map(rowHTML).join("\n");
  }
}

function esc(ch) {
  return ch === "<" ? "&lt;" : ch === ">" ? "&gt;" : ch === "&" ? "&amp;" : ch;
}

function glyph(ch) {
  const cp = ch.codePointAt(0);
  const boxDrawing = cp >= 0x2500 && cp <= 0x259f;
  return cp >= 0x2000 && !boxDrawing ? `<span class="g">${ch}</span>` : esc(ch);
}

function rowHTML(row) {
  let out = "";
  let i = 0;
  while (i < row.length) {
    const c = row[i][1];
    let text = "";
    while (i < row.length && row[i][1] === c) text += glyph(row[i++][0]);
    out += c ? `<span class="${c.split(" ").map((t) => "t-" + t).join(" ")}">${text}</span>` : text;
  }
  return out;
}

/* ---------- Shared chrome ---------- */

function hdr(b, area, ctx, right = "") {
  b.clear(0, 0, W, 1, "hdr");
  let x = b.put(1, 0, "carrova", "hdr b acc");
  x = b.put(x + 1, 0, "0.1.0", "hdr dim");
  x = b.put(x, 0, "  │  ", "hdr line");
  x = b.put(x, 0, area, "hdr b");
  if (ctx) {
    x = b.put(x, 0, "  │  ", "hdr line");
    b.put(x, 0, ctx, "hdr");
  }
  if (right) b.putR(99, 0, right, "hdr dim");
}

function foot(b, keys) {
  b.clear(0, H - 1, W, 1, "hdr");
  let x = 1;
  for (const [k, label] of keys) {
    x = b.put(x, H - 1, k, "hdr key");
    x = b.put(x, H - 1, " " + label + "   ", "hdr dim");
  }
}

function popup(b, w, h, title, tone = "acc") {
  const x = Math.floor((W - w) / 2);
  const y = Math.floor((H - h) / 2);
  b.addClass(x + 2, y + h, w, 1, "shadow");
  b.addClass(x + w, y + 1, 2, h, "shadow");
  b.bg = "pop";
  b.clear(x, y, w, h);
  b.box(x, y, w, h, title, { double: true, cls: tone, tcls: "b " + tone });
  return { x: x + 3, y: y + 2, w: w - 6 };
}

function endPopup(b) {
  b.bg = "";
}

function spin(b, x, y) {
  b.put(x, y, SPIN[2], "acc spin");
}

function kv(b, x, y, k, v, vc = "", kw = 16) {
  b.put(x, y, k, "dim");
  return b.put(x + kw, y, v, vc);
}

function check(b, x, y, text, c = "") {
  b.put(x, y, "✓", "ok");
  return b.put(x + 2, y, text, c);
}

function choice(b, x, y, key, label, c = "") {
  let xx = b.put(x, y, "[" + key + "]", "key");
  return b.put(xx + 1, y, label, c);
}

/* ---------- Data (same session as gui.html) ---------- */

const SENDER = "ezio-desktop";
const RECEIVER = "ezio-thinkpad-new";
const APPS = [
  ["Git", "name, email, aliases", "4 KB"],
  ["SSH", "server list and shortcuts", "14 KB"],
  ["GnuPG", "public keys and trust", "96 KB"],
  ["Bash and Zsh", "history, aliases, prompt", "2.3 MB"],
  ["VS Code", "settings, keybindings, snippets", "1.2 GB"],
];
const ASKS = [
  ["Your SSH keys", "Log you in to servers and GitHub. Anyone with a copy can, too."],
  ["Your GnuPG secret keys", "Sign your commits and open mail sent to you."],
  ["Shell startup files", "Run every time you open a terminal. Bring if you checked them."],
];

/* ---------- Layout kit: one focus per screen ---------- */

const X0 = 8;   // wizard column start
const CW = 84;  // wizard column width

/* Header: product name, where you are, steps as dots (wizard) or a quiet tab bar (hub). */
function wizard(b, flow, step, total, right = "") {
  hdr(b, flow, "", right);
  let x = 99 - (right ? right.length + 3 : 0) - total * 2;
  for (let i = 1; i <= total; i++) x = b.put(x, 0, i < step ? "● " : i === step ? "◉ " : "○ ", i <= step ? "hdr acc" : "hdr dim");
}
function hub(b, tab) {
  b.clear(0, 0, W, 1, "hdr");
  let x = b.put(1, 0, "carrova", "hdr b acc") + 3;
  for (const t of ["Home", "History", "Apps", "Settings"]) {
    x = b.put(x, 0, t === tab ? ` ${t} ` : ` ${t} `, t === tab ? "hdr b u" : "hdr dim") + 1;
  }
}
function title(b, y, text, sub = "") {
  b.put(X0, y, text, "b");
  return sub ? b.wrap(X0, y + 1, CW, sub, "dim") + 1 : y + 2;
}
function primary(b, x, y, label) { return b.put(x, y, ` ${label} `, "inv"); }
function secondary(b, x, y, label) { return b.put(x, y, `‹ ${label} ›`, "acc"); }
function actions(b, y, left, right) {
  if (left) secondary(b, X0, y, left);
  if (right) primary(b, X0 + CW - right.length - 2, y, right);
}
function rule(b, y) { b.put(X0, y, "─".repeat(CW), "line"); }
function lock(b, y, text, x = X0) { b.put(x, y, "✓", "ok"); b.put(x + 2, y, text, "ok"); }
function banner(b, y, tone, head, body = "") {
  const c = { sens: "sens", err: "err", acc: "acc", ok: "ok" }[tone];
  b.put(X0, y, "▌", c);
  b.put(X0 + 2, y, head, "b " + c);
  if (body) return b.wrap(X0 + 2, y + 1, CW - 2, body, "dim") + 1;
  return y + 2;
}
function appRow(b, y, [name, what, size], on = true, sel = false) {
  if (sel) { b.clear(X0 - 1, y, CW + 2, 1, "sel"); b.bg = "sel"; }
  b.put(X0, y, on ? "[✓]" : "[ ]", on ? "acc" : "dim");
  b.put(X0 + 4, y, name, "b");
  b.put(X0 + 20, y, what, "dim");
  b.putR(X0 + CW, y, size, "dim");
  b.bg = "";
}
function ask(b, y, [name, why], value, sel = false) {
  if (sel) { b.clear(X0 - 1, y, CW + 2, 2, "sel"); b.bg = "sel"; }
  b.put(X0, y, "◆", "sens");
  b.put(X0 + 2, y, name, "b");
  const opts = ["Leave behind", "Bring them"];
  let x = X0 + CW - 29;
  for (const o of opts) {
    x = b.put(x, y, o === value ? `(•) ${o}` : `( ) ${o}`, o === value ? "acc b" : "dim") + 2;
  }
  b.put(X0 + 2, y + 1, why, "dim", CW - 2);
  b.bg = "";
}
/* The code: each character a tile, three rows tall, readable across a room. */
function bigCode(b, y, words, x0) {
  const chars = words.join("-");
  const width = [...chars].reduce((n, c) => n + (c === "-" ? 3 : 4), -1);
  let x = x0 ?? Math.floor((W - width) / 2);
  for (const c of chars) {
    if (c === "-") { b.put(x + 1, y + 1, "─", "dim"); x += 3; continue; }
    const cls = /\d/.test(c) ? "inv" : "tile";
    b.put(x, y, "   ", cls); b.put(x, y + 1, ` ${c} `, cls); b.put(x, y + 2, "   ", cls);
    x += 4;
  }
}
function chipRow(b, y, [name, , size], state, extra = "") {
  const mark = { done: ["✓", "ok"], moving: [SPIN[2], "acc spin"], wait: ["·", "dim"], fail: ["✗", "err"] }[state];
  b.put(X0, y, mark[0], mark[1]);
  b.put(X0 + 2, y, name, state === "wait" ? "dim" : "b");
  b.put(X0 + 20, y, size, "dim");
  b.putR(X0 + CW, y, extra || { done: "arrived", moving: "moving", wait: "waiting", fail: "failed" }[state], mark[1].replace(" spin", ""));
}

/* ---------- Screens ---------- */

const READY = "ready";
const P4 = "p4";
const P5 = "p5";

const SCREENS = [];
function screen(id, group, title, phase, note, draw) {
  SCREENS.push({ id, group, title, phase, note, draw });
}

/* Start */

screen("welcome", "Start", "Welcome (first run)", P4,
  "One screen instead of three: what Carrova does, three promises, and error-report consent (off, asked once).",
  (b) => {
    hdr(b, "Welcome");
    let y = title(b, 3, "Bring your setup to a new computer.", "Settings, keys and data for the apps you use. You choose what moves; the apps themselves get reinstalled.");
    for (const [h, s] of [["Straight between your computers.", "No account, no cloud, encrypted on the way."], ["Nothing changes until you approve.", "You see exactly what will change first."], ["Every move can be undone.", "Replaced files are backed up. Undo for 30 days."]]) {
      check(b, X0, y, h, "b"); b.put(X0 + 2, y + 1, s, "dim"); y += 3;
    }
    b.put(X0, y + 1, "[ ] Send error reports if Carrova crashes", ""); b.put(X0 + 4, y + 2, "No file names, contents or keys.", "dim");
    actions(b, 27, "", "Get started");
    foot(b, [["enter", "get started"], ["space", "toggle reports"], ["q", "quit"]]);
  });

screen("home", "Start", "Home", READY,
  "Two verbs. The file route is a quiet third key. The last move sits on one line with its undo key.",
  (b) => {
    hub(b, "Home");
    b.center(5, "What are we doing on this computer?", "b");
    b.box(18, 8, 30, 7, "", { rounded: true, cls: "acc" });
    b.box(52, 8, 30, 7, "", { rounded: true, cls: "line" });
    b.put(21, 10, "↑  Send", "b acc"); b.put(24, 12, "This is the old computer", "dim");
    b.put(55, 10, "↓  Receive", "b"); b.put(58, 12, "This is the new computer", "dim");
    b.center(17, "f  use an encrypted file instead", "dim");
    b.center(22, `↺ Received from ${SENDER} yesterday, 5 apps.   u undo`, "dim");
    foot(b, [["←→", "choose"], ["enter", "start"], ["f", "file"], ["h", "history"], ["a", "apps"], ["s", "settings"], ["q", "quit"]]);
  });

/* Send */

screen("send-found", "Send", "Here's what we found", READY,
  "Was scan + selection tree + sensitive confirm. Now one summary: app rows with sizes, and the three risky items asked once in plain words, defaulting to leave behind. 'c' drills into the full tree.",
  (b) => {
    wizard(b, "Send", 1, 4, SENDER);
    let y = title(b, 2, "Here's what we found", "5 apps, 412 files, 1.2 GB. We ticked what most people bring.");
    APPS.forEach((a, i) => appRow(b, y + i, a, true, i === 0));
    y += APPS.length + 1;
    b.put(X0, y, "Needs your OK", "b"); b.putR(X0 + CW, y, "off unless you say so", "sens");
    y += 1;
    ASKS.forEach((a, i) => ask(b, y + i * 2, a, "Leave behind"));
    actions(b, 27, "c Customize", "Get pairing code");

  APPS.forEach((a, i) => chipRow(b, y + i, a, states[i], states[i] === "moving" && i === 4 ? meta[0] : ""));
  lock(b, y + 6, lockText);
  foot(b, keys);
}

/* ---------- Page wiring ---------- */

const BADGE = {
  ready: ["engine ready", "ready"],
  p4: ["Phase 4 — planned", "p4"],
  p5: ["Phase 5 — planned", "p5"],
};

function renderScreen(s) {
  const b = new Buf();
  s.draw(b);
  return b.toHTML();
}

function buildIndex() {
  const nav = document.getElementById("index");
  const groups = [...new Set(SCREENS.map((s) => s.group))];
  nav.innerHTML = groups.map((g) => {
    const items = SCREENS.filter((s) => s.group === g).map((s) => {
      const [label, cls] = BADGE[s.phase];
      return `<li><a href="#tui-${s.id}" data-id="${s.id}"><span>${s.title}</span><span class="badge ${cls}">${label}</span></a></li>`;
    }).join("");
    return `<h2>${g}</h2><ol>${items}</ol>`;
  }).join("");
}

function currentIndex() {
  const id = location.hash.replace("#tui-", "");
  const i = SCREENS.findIndex((s) => s.id === id);
  return i < 0 ? 0 : i;
}

function show(i, focus = false) {
  const s = SCREENS[i];
  document.getElementById("screen").innerHTML = renderScreen(s);
  document.getElementById("screen").setAttribute("aria-label", "Terminal screen: " + s.title);
  document.getElementById("screenTitle").textContent = s.title;
  document.getElementById("screenGroup").textContent = s.group;
  const [label, cls] = BADGE[s.phase];
  const badge = document.getElementById("screenBadge");
  badge.textContent = label;
  badge.className = "badge " + cls;
  document.getElementById("screenNote").textContent = s.note;
  document.querySelectorAll("#index a").forEach((a) => {
    if (a.dataset.id === s.id) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  if (focus) document.getElementById("screenTitle").focus();
}

function step(delta) {
  const i = (currentIndex() + delta + SCREENS.length) % SCREENS.length;
  location.hash = "tui-" + SCREENS[i].id;
}

function toggle(btn, apply) {
  const on = btn.getAttribute("aria-pressed") !== "true";
  btn.setAttribute("aria-pressed", String(on));
  apply(on);
}

function startSpinner() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let f = 0;
  setInterval(() => {
    f = (f + 1) % SPIN.length;
    document.querySelectorAll(".t-spin .g").forEach((g) => { g.textContent = SPIN[f]; });
  }, 110);
}

function init() {
  buildIndex();
  show(currentIndex());
  window.addEventListener("hashchange", () => show(currentIndex(), true));
  document.getElementById("prev").addEventListener("click", () => step(-1));
  document.getElementById("next").addEventListener("click", () => step(1));
  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
  });
  /* Page theme follows the OS (live) until the toggle is used. */
  const pageBtn = document.getElementById("pageTheme");
  const mqDark = window.matchMedia("(prefers-color-scheme: dark)");
  let chosen = false;
  const setPage = (dark) => {
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    pageBtn.setAttribute("aria-pressed", String(dark));
  };
  setPage(mqDark.matches);
  mqDark.addEventListener("change", () => { if (!chosen) setPage(mqDark.matches); });
  pageBtn.addEventListener("click", () => toggle(pageBtn, (on) => { chosen = true; setPage(on); }));
  const termBtn = document.getElementById("termPalette");
  termBtn.addEventListener("click", () => toggle(termBtn, (on) => {
    document.getElementById("term").classList.toggle("light", on);
  }));
  startSpinner();
}

if (typeof document !== "undefined") init();
if (typeof module !== "undefined") module.exports = { SCREENS, Buf };
