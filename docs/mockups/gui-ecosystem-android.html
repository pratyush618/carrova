      ${ig("Computers", [devRow(LAPD, { go: "device:on" }), devRow(PCD), srow("plus", "Add a computer", "", chev, { go: "scan:aim" })])}
      ${ig("Screen and input", [srow("monitor", "Screen and control", "Ask to see · never control", chev, { go: "settings:screen" })])}
      ${ig("Background", [srow("power", "Stay connected", "One quiet notification keeps the link", toggle(1)), srow("batt", "Battery", "Unrestricted", chev, { go: "settings:battery" }), srow("bell", "Alerts", "", chev, { go: "settings:alerts" })])}
      ${ig("Updates", [
        ...(ready ? [srow("arrowD", "Carrova 0.4.0 is ready", "52.1 MB", chev, { go: "update:details", tone: "accent" })] : []),
        srow("info", "Carrova 0.3.0", "Open source · Apache-2.0", ""),
        srow("refresh", "Check for updates", "Last checked today, 9:12", btn("Check now", { size: "sm" })),
        srow("wifi", "Download on mobile data", "Off: updates wait for Wi-Fi", toggle(0)),
      ], "Updates come from Carrova's GitHub releases. Android asks before anything installs.")}
      ${ig("About", [srow("warn", "Error reports", "Ask before sending", toggle(0))])}` });
}

/* ═══ App update (sideloaded APK from GitHub releases) ═══════════════ */
const UPV = "0.4.0", UPSZ = "52.1 MB";
const upHead = `<div class="devhead">${glyph(MARK, "accent")}<div style="flex:1"><b>Carrova ${UPV}</b><div class="small sec" style="margin-top:2px">${UPSZ} · you have 0.3.0</div></div></div>`;
const upProg = (pct, got, line, broken) => `<div class="live"><div class="pct"><b>${pct}%</b><span>${got} of ${UPSZ}</span></div><div class="track${broken ? " track--broken" : ""}" style="margin-top:12px"><span class="track__fill" style="inline-size:${pct}%"></span></div><p class="small muted" style="margin-top:8px">${line}</p></div>`;
const upPage = (body, over) => phone({ back: "settings:main", title: "Update", nav: false, body: upHead + body, over });
add({ id: "update", group: "Updates", title: "Update Carrova", states: [["available", "Ready (Home)"], ["settings", "Ready (Settings)"], ["details", "What's new"], ["mobile", "On mobile data"], ["queued", "Queued for Wi-Fi"], ["downloading", "Downloading"], ["paused", "Paused"], ["waiting", "Waiting for Wi-Fi"], ["verifying", "Checking signature"], ["permission", "Install permission"], ["installer", "Android installer"], ["failed", "Failed"], ["done", "Updated"]],
  note: "No Play Store: Carrova downloads Carrova_<v>_android-arm64.apk from GitHub releases, checks it against the release key, then hands it to Android's package installer. It never downloads on mobile data unless you allow it, and never installs without Android's own prompt. Linked computers reconnect by themselves after the update.",
  render(st) {
    if (st === "available") return homePhone({ req: `<div class="req4">${glyph(icon("arrowD"), "accent")}<div class="req4__t"><b>Carrova ${UPV} is ready</b><span>${UPSZ} · see what's new</span></div>${btn("View", { kind: "primary", size: "sm", go: "update:details" })}</div>` });
    if (st === "settings") return settingsMain(true);
    if (st === "details" || st === "mobile") {
      const mobile = st === "mobile";
      return upPage(`<div class="card card--pad" style="margin:18px 0 22px"><b>What's new</b><ul class="small sec" style="margin-top:8px;display:grid;gap:6px;list-style:disc;padding-inline-start:18px"><li>See a computer's screen and control it from this phone</li><li>Use this phone as a touchpad and keyboard</li><li>Faster file transfers on busy Wi-Fi</li></ul><p style="margin-top:12px"><a class="link small" href="#">Full notes</a></p></div>
        ${mobile ? `<div class="ig"><h3 id="optData">You're on mobile data</h3><div class="pick4s" role="radiogroup" aria-labelledby="optData">${opt("data", "Wait for Wi-Fi", "Downloads by itself when you're back on Wi-Fi", 1)}${opt("data", "Use mobile data", `${UPSZ} from your data plan`, 0)}</div></div>` : ""}
        <div class="row" style="justify-content:flex-end;gap:8px">${btn("Later", { kind: "quiet", go: "home:linked" })}${btn(mobile ? "Download on Wi-Fi" : "Download", { kind: "primary", go: mobile ? "update:queued" : "update:downloading" })}</div>
        <p class="xs muted" style="margin-top:14px">Checked against Carrova's release key. Android asks before installing.</p>`);
    }
    if (st === "downloading") return upPage(`<div style="margin-top:18px">${upProg(35, "18.4", `<span class="num">3.2 MB/s</span> · About 11 s left`)}</div><div class="row" style="margin-top:16px;justify-content:flex-end;gap:8px">${btn("Cancel", { kind: "quiet" })}${btn("Pause", { icon: "pause", go: "update:paused" })}</div>`);
    if (st === "paused") return upPage(`<div style="margin-top:18px">${upProg(35, "18.4", "Paused · picks up from here when you resume", 1)}</div><div class="row" style="margin-top:16px;justify-content:flex-end;gap:8px">${btn("Cancel", { kind: "quiet" })}${btn("Resume", { kind: "primary", icon: "play", go: "update:downloading" })}</div>`);
    if (st === "queued") return upPage(`<div style="margin-top:18px">${upProg(0, "0", "Waiting for Wi-Fi to start")}</div><div class="banner" style="margin-top:14px">${icon("wifi")}<div><b>Starts on Wi-Fi</b>Nothing is downloaded yet. The download starts by itself when you're on Wi-Fi.</div></div><div class="row" style="margin-top:16px;justify-content:flex-end;gap:8px">${btn("Cancel", { kind: "quiet", go: "update:details" })}${btn("Use mobile data", { kind: "primary", go: "update:downloading" })}</div>`);
    if (st === "waiting") return upPage(`<div style="margin-top:18px">${upProg(35, "18.4", "Waiting for Wi-Fi", 1)}</div><div class="banner banner--warn" style="margin-top:14px">${icon("wifi")}<div><b>Wi-Fi dropped</b>The download picks up where it stopped when you're back on Wi-Fi.</div></div><div class="row" style="margin-top:16px;justify-content:flex-end;gap:8px">${btn("Cancel", { kind: "quiet" })}${btn("Use mobile data", { kind: "primary", go: "update:downloading" })}</div>`);
    if (st === "verifying") return upPage(`<div style="margin-top:18px">${upProg(100, "52.1", `<span class="btn--loading" style="display:inline-flex;vertical-align:middle;margin-inline-end:6px"></span>Checking the signature`)}</div>`);
    if (st === "permission") return phone({ back: "update:details", title: "Allow updates", nav: false, body: `<div class="banner banner--warn" style="margin-bottom:18px">${icon("lock")}<div><b>Android needs your OK first</b>Carrova isn't allowed to install apps yet, so the update is waiting. It's downloaded and checked.</div></div>
      <ol class="steps-v"><li><span class="dot dot--accent">1</span><div><b>Open Install unknown apps</b><span>Tap the button below. It opens on Carrova.</span></div></li><li><span class="dot dot--muted">2</span><div><b>Turn on Allow from this source</b></div></li><li><span class="dot dot--muted">3</span><div><b>Come back here</b><span>Android then asks before it installs.</span></div></li></ol>
      <div style="margin-top:14px">${btn("Open Android settings", { kind: "primary", size: "lg", cls: "wide", go: "update:installer" })}</div><p class="small muted" style="text-align:center;margin-top:12px">Only Carrova's own updates use this. You can turn it off after.</p>` });
    if (st === "installer") return upPage(`<div style="margin-top:18px">${upProg(100, "52.1", "Checked · waiting for Android")}</div>`, sysdlg(`<span class="sysdlg__ic">${MARK}</span><h3>Carrova</h3><p>Do you want to install this update to this existing app? Your existing data will not be lost.</p><div class="sysdlg__row"><span>Cancel</span><span class="p" data-go="update:done" style="cursor:pointer">Update</span></div>`));
    if (st === "failed") return upPage(`<div class="banner banner--danger" style="margin-top:18px">${icon("warn")}<div><b>Update didn't install</b>The download didn't match Carrova's release signature, so it was deleted. Nothing changed: you're still on 0.3.0.</div></div><div class="row" style="margin-top:16px;justify-content:flex-end">${btn("Download again", { kind: "primary", go: "update:downloading" })}</div>`);
    return homePhone({ over: toast(`Updated to ${UPV}`, "What's new") });
  } });

/* ═══ System surfaces (Android's own UI) ═══════════════════════════ */
const ongoing = `<div class="sn sn--ongoing"><div class="sn__top"><span class="appi">${MARK.replace('class="mark"', 'class="icon"')}</span>Carrova</div><b>Linked to ${LAP}</b><p>Clipboard, notifications and messages are on</p><div class="sn__acts"><span>Send clipboard</span><span>Pause</span></div></div>`;
add({ id: "sys", group: "System surfaces", title: "Android surfaces", states: [["shade", "Notification shade"], ["heads", "Heads-up ask"], ["lock", "Lock screen"], ["tile", "Quick-settings tile"], ["sharing", "Sharing notification"], ["controlled", "Control notification"], ["update", "Update download"]],
  note: "Android's own UI, drawn in system colours like v4's desktop surfaces. The Linked notification is required to keep the link alive and doubles as the clipboard button. Asks arrive as heads-up notifications; the lock screen hides names by default. While a computer sees or controls the phone, a red status-bar chip and an ongoing notification with Stop are always shown; neither can be turned off.",
  render(st) {
    const top = `<div class="sys__clock"><span>Sat, 15 Nov</span></div>`;
    if (st === "lock") return phone({ full: `<div class="sysbg"></div><div class="sys"><div class="sys__lock"><b>9:41</b><span>Saturday, 15 November</span></div><div class="sn"><div class="sn__top"><span class="appi">${MARK.replace('class="mark"', 'class="icon"')}</span>Carrova · now</div><b>A linked computer wants to send you files</b><p>Unlock to review</p></div></div>` });
    if (st === "heads") return phone({ themed: 1, full: appbg + `<div class="sys" style="padding-top:44px"><div class="sn" style="box-shadow:0 18px 40px #0009"><div class="sn__top"><span class="appi">${MARK.replace('class="mark"', 'class="icon"')}</span>Carrova · now</div><b>${LAP} wants to see this screen</b><p>View only</p><div class="sn__acts"><span>Decline</span><span class="p">Allow</span></div></div></div>` });
    const tiles = `<div class="qs"><span class="qs__t on">${icon("wifi")}<span>Wi-Fi<small>Home</small></span></span><span class="qs__t on">${icon("bt")}<span>Bluetooth<small>${LAP}</small></span></span><span class="qs__t${st === "tile" ? " is-edit" : " on"}">${icon("clip")}<span>Send clipboard<small>Carrova</small></span></span><span class="qs__t">${icon("moon")}<span>Do not disturb<small>Off</small></span></span></div>`;
    if (st === "sharing" || st === "controlled") {
      const ctl = st === "controlled";
      const live = `<div class="sn sn--ongoing"><div class="sn__top"><span class="appi">${MARK.replace('class="mark"', 'class="icon"')}</span>Carrova · ${ctl ? "01:05" : "00:42"}</div><b>${LAP} is ${ctl ? "controlling" : "viewing"} this ${ctl ? "phone" : "screen"}</b><p>${ctl ? "Taps and typing from the laptop act as you" : "View only"}</p><div class="sn__acts"><span class="p">Stop</span></div></div>`;
      return phone({ rec: ctl ? "Control" : "Sharing", full: `<div class="sysbg sysbg--dim"></div><div class="sys">${top}${tiles}${live}${ongoing}</div>` });
    }
    if (st === "update") return phone({ full: `<div class="sysbg sysbg--dim"></div><div class="sys">${top}${tiles}<div class="sn sn--ongoing"><div class="sn__top"><span class="appi">${MARK.replace('class="mark"', 'class="icon"')}</span>Carrova · now</div><b>Downloading Carrova 0.4.0</b><p>18.4 of 52.1 MB · 3.2 MB/s · About 11 s left</p><div class="sn__bar"><i style="inline-size:35%"></i></div><div class="sn__acts"><span>Pause</span><span>Cancel</span></div></div>${ongoing}</div>` });
    if (st === "tile") return phone({ full: `<div class="sysbg sysbg--dim"></div><div class="sys">${top}${tiles}<p style="text-align:center;color:#a8aab1;font-size:12.5px;margin-top:6px">Hold and drag to add tiles</p></div>` });
    return phone({ full: `<div class="sysbg sysbg--dim"></div><div class="sys">${top}${tiles}${ongoing}<div class="sn"><div class="sn__top"><span class="appi">${MARK.replace('class="mark"', 'class="icon"')}</span>Carrova · 2 min</div><b>2 files from ${LAP}</b><p>thesis.pdf and 1 more</p><div class="sn__acts"><span>Open</span><span>Show in Downloads</span></div></div><div class="sn"><div class="sn__top"><span class="appi">${MARK.replace('class="mark"', 'class="icon"')}</span>Carrova · 5 min</div><b>Sending to ${LAP}</b><p>3 photos · 64%</p><div class="sn__bar"><i style="inline-size:64%"></i></div></div></div>` });
  } });

/* ═══ Runtime (gui-v4's, minus the desktop window) ═══════════════════ */
const $ = s => document.querySelector(s);
let timers = [], cur = { id: "", st: "" };
const reduced = () => document.documentElement.classList.contains("rm") || matchMedia("(prefers-reduced-motion: reduce)").matches;
const clearTimers = () => { timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; };
function render() {
  const s = SCREENS.find(x => x.id === cur.id);
  $("#frame").innerHTML = s.render(cur.st);
  $("#sTitle").textContent = s.title;
  $("#sNote").textContent = s.note || "";
  $("#sStates").innerHTML = s.states.length > 1 ? s.states.map(([k, l]) => `<button class="pill" type="button" data-go="${s.id}:${k}" aria-current="${k === cur.st}">${l}</button>`).join("") : "";
  document.querySelectorAll(".nav__link").forEach(a => a.dataset.go === `${s.id}:${cur.st}` ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  clearTimers();
}
function go(ref) {
  const [id, st] = (ref || "").split(":");
  const s = SCREENS.find(x => x.id === id) || SCREENS[0];
  cur = { id: s.id, st: s.states.some(([k]) => k === st) ? st : s.states[0][0] };
  const want = `${cur.id}:${cur.st}`;
  if (location.hash.slice(1) !== want) history.replaceState(null, "", "#" + want);
  render();
}
(function buildNav() {
  const groups = {};
  SCREENS.forEach(s => (groups[s.group] ||= []).push(s));
  $("#navList").innerHTML = Object.entries(groups).map(([g, ss]) => `<div class="nav__group"><h4>${g}</h4>${ss.map(s => s.states.map(([k, l]) => `<button class="nav__link" type="button" data-go="${s.id}:${k}">${s.states.length > 1 ? `${s.title.split(" · ")[0]} <span class="muted">· ${l}</span>` : s.title}</button>`).join("")).join("")}</div>`).join("");
})();
const ALL = SCREENS.flatMap(s => s.states.map(([k]) => `${s.id}:${k}`));
const first = () => `${cur.id}:${SCREENS.find(x => x.id === cur.id).states[0][0]}`;
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go]");
  if (t && t.dataset.go && !t.disabled) { e.preventDefault(); go(t.dataset.go); return; }
  const tg = e.target.closest(".toggle");
  if (tg) { tg.classList.toggle("is-on"); tg.setAttribute("aria-checked", tg.classList.contains("is-on")); return; }
  const sb = e.target.closest(".seg button");
  if (sb) { sb.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === sb)); return; }
  if (e.target.closest(".scrim") || e.target.closest(".bsheet__foot .btn:not(.btn--primary), .pdlg .dialog__foot .btn:not(.btn--primary)")) go(first());
  if (e.target.closest("a[href='#']")) e.preventDefault();
});
const setDark = k => { document.documentElement.dataset.dark = k; document.querySelectorAll("button[data-dark]").forEach(b => b.setAttribute("aria-pressed", b.dataset.dark === k)); };
const setTheme = th => { document.documentElement.dataset.theme = th; $("#tTheme").setAttribute("aria-pressed", th === "dark"); };
setDark(new URLSearchParams(location.search).get("dark") || DEFAULT_DARK);
document.querySelectorAll("button[data-dark]").forEach(b => b.onclick = () => { setDark(b.dataset.dark); setTheme("dark"); render(); });
setTheme(new URLSearchParams(location.search).get("theme") || "dark");
$("#tTheme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
$("#tMotion").onclick = e => { const on = document.documentElement.classList.toggle("rm"); e.currentTarget.setAttribute("aria-pressed", on); render(); };
$("#tReplay").onclick = () => render();
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  const i = ALL.indexOf(`${cur.id}:${cur.st}`);
  if (e.key === "]") go(ALL[(i + 1) % ALL.length]);
  else if (e.key === "[") go(ALL[(i - 1 + ALL.length) % ALL.length]);
  else if (e.key === "t") $("#tTheme").click();
  else if (e.key === "r") render();
  else if (e.key === "Escape") go(first());
});
document.querySelector(".nav__brand svg").outerHTML = MARK;
window.addEventListener("hashchange", () => go(location.hash.slice(1)));
go(location.hash.slice(1) || "welcome:first");
</script>
</body>
</html>
